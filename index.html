  function getSituation() {
    var hs = game.humanSeat();
    if (hs < 0) return null;
    var key = situationKey();
    if (sitCache.key === key && sitCache.data) return sitCache.data;
    var a = game.awaiting;
    var relevant = !!(a && a.seat === hs);          // 只有轮到我操作时才值得重算
    if (!relevant && sitCache.data) return sitCache.data;
    var H = game.hand;
    var t0 = Date.now();
    var res = ZMJ.analyzeSituation(H, hs, { worlds: cfg.worlds, seed: (game.handNo * 977 + H.turnCount * 31 + 7) >>> 0 });
    var cands = game.evaluateDiscards(hs).slice(0, 5).map(function (c) {
      var d = res.dealIn(c.kind);
      return { kind: c.kind, shanten: c.shanten, ukeire: c.ukeire, danger: c.danger, prob: d.prob, killers: d.killers };
    });
    sitCache = { key: key, data: { res: res, cands: cands, ms: Date.now() - t0, seat: hs }, cands: cands };
    // 采集训练数据：首次听牌时全桌的摸牌序号与未见有效张数
    if (handExtra && cands.length && cands[0].shanten === 0 && handExtra.tenpaiTurn == null) {
      var u = game.ukeireFor(hs);
      handExtra.tenpaiTurn = H.turnCount;
      handExtra.tenpaiOuts = u.total;
    }
    return sitCache.data;
  }
  function getTrainingGuide(kind, includePaths) {
    var hs = game.humanSeat();
    if (hs < 0) return null;
    var key = situationKey() + '|' + game.hand.players[hs].concealed.join('');
    if (guideCache.key !== key) guideCache = { key: key, entries: {} };
    var entry = guideCache.entries[kind];
    if (!entry || (includePaths && !entry.withPaths)) {
      entry = { withPaths: !!includePaths,
        guide: ZMJ.trainingGuide(game.hand, hs, kind, includePaths) };
      guideCache.entries[kind] = entry;
    }
    return entry.guide;
  }
  function riskCls(p) { return p >= 0.10 ? 'risk-hi' : (p >= 0.04 ? 'risk-mid' : 'risk-lo'); }
  function barColor(p) { return p >= 0.45 ? '#ff9a8b' : (p >= 0.2 ? '#ffcf7a' : '#7ee2a8'); }

  function renderSituation() {
    var el = $('situation');
    if (!el) return;
    var hs = game.humanSeat();
    if (hs < 0) { el.innerHTML = '<span style="color:#9fb3a8">你在等待区，先看别人打。</span>'; return; }
    if (!cfg.analyze) { el.innerHTML = '<span style="color:#9fb3a8">已在设置里关闭</span>'; return; }
    var H = game.hand, a = game.awaiting;
    var myTurn = !!(a && a.type === 'turn' && a.seat === hs);
    var sit = getSituation();
    if (!sit) { el.innerHTML = ''; return; }
    var res = sit.data ? sit.data : sit;
    var r = sit.res || res;
    var cands = sit.cands;
    var out = [];
    out.push('<div class="sitHead">全桌第 ' + H.turnCount + ' 摸 · 牌墙 ' + H.wall.length + ' 张 · 分析 ' + ((sit.ms != null ? sit.ms : r.ms) || 0) + 'ms / ' + cfg.worlds + ' 组采样</div>');
    // 对手威胁
    out.push('<div class="sitSec">对手威胁（推断）</div>');
    r.opponents.forEach(function (o) {
      var nm = game.nameOf(o.seat);
      out.push('<div class="opp"><span class="nm">' + nm + '</span>' +
        '<span class="bar"><i style="width:' + Math.round(o.tenpaiProb * 100) + '%;background:' + barColor(o.tenpaiProb) + '"></i></span>' +
        '<span class="pc ' + riskCls(o.tenpaiProb) + '">' + Math.round(o.tenpaiProb * 100) + '%</span></div>');
      if (o.waits.length) {
        out.push('<div class="waits">听：' + o.waits.slice(0, 4).map(function (x) { return ZMJ.tileName(x.kind) + ' ' + Math.round(x.prob * 100) + '%'; }).join('、') + '</div>');
      }
    });
    // 打牌风险
    if (myTurn && cands.length) {
      var maxP = 0;
      cands.forEach(function (c) { if (c.prob > maxP) maxP = c.prob; });
      out.push('<div class="sitSec">我打每张牌的放铳概率</div>');
      if (maxP < 0.005) {
        out.push('<div style="color:#7ee2a8;font-size:12.5px">采样暂未发现明显听牌迹象。上方「出牌讲解」列出了牌效推荐、有效牌和计算依据。</div>');
      } else {
      out.push('<table class="sit">');
      cands.forEach(function (c, i) {
        var kill = c.killers.length ? '<span class="kill">' + c.killers.map(function (k) { return game.nameOf(k.seat) + Math.round(k.prob * 100) + '%'; }).join(' ') + '</span>' : '';
        out.push('<tr class="' + (i === 0 ? 'rec' : '') + '"><td>' + ZMJ.tileName(c.kind) + '</td>' +
          '<td style="color:#9fb3a8">向' + c.shanten + '</td>' +
          '<td style="color:#9fb3a8">进' + c.ukeire + '</td>' +
          '<td class="' + riskCls(c.prob) + '" style="text-align:right">' + (c.prob * 100).toFixed(1) + '%</td>' +
          '<td>' + kill + '</td></tr>');
      });
      out.push('</table>');
      }
      // 建议：进张价值 vs 放铳风险
      var best = null;
      cands.forEach(function (c) {
        var score = c.ukeire - c.prob * 160;   // 放铳 1% ≈ 牺牲 1.6 张进张（按 12.7 元 vs 进张价值估算）
        if (!best || score > best.score) { best = { c: c, score: score }; }
      });
      var safest = cands.slice().sort(function (x, y) { return x.prob - y.prob; })[0];
      out.push('<div class="advice">风险折中参考：打 <b>' + ZMJ.tileName(best.c.kind) + '</b>（进张 ' + best.c.ukeire + '，采样放铳 ' + (best.c.prob * 100).toFixed(1) + '%）');
      if (safest.kind !== best.c.kind && safest.prob + 0.02 < best.c.prob) {
        out.push('<br>想稳一点可以打 <b>' + ZMJ.tileName(safest.kind) + '</b>（放铳仅 ' + (safest.prob * 100).toFixed(1) + '%，但进张 ' + safest.ukeire + '）');
      }
      out.push('<br><small>此处是启发式权衡，采样概率有误差；纯牌效推导见上方。</small></div>');
    } else if (!myTurn) {
      out.push('<div class="sitHead" style="margin-top:6px">（非我回合，显示的是最新推断）</div>');
    }
    el.innerHTML = out.join('');
  }

  // 手机端常驻一行摘要
  function renderMiniHint() {
    var el = $('miniHint');
    if (!el) return;
    var hs = game.humanSeat();
    if (hs < 0) { el.textContent = '你在等待区，快进中…'; return; }
    if (!cfg.hint) { el.textContent = '提示已关闭'; return; }
    var H = game.hand, p = H.players[hs];
    var a = game.awaiting;
    if (a && a.type === 'claim' && a.options.hu) {
      var outs = game.ukeireFor(hs).total, left = game.drawsLeft();
      var prob = Math.round(selfDrawProb(outs + 1, left, Math.max(H.wall.length, 8)) * 100);
      var threat = 0;
      for (var t = 0; t < 4; t++) if (t !== hs && H.players[t].melds.length >= 2) threat++;
      var need = outs >= 8 ? 2 : outs >= 6 ? 3 : outs >= 4 ? 4 : outs >= 3 ? 5 : 8;
      if (threat >= 2) need += 2;
      el.textContent = '收炮抉择：听 ' + outs + ' 种 · 还能摸 ' + left + ' 巡 · 自摸概率约 ' + prob + '% → ' +
        (outs >= 2 && left >= need ? '建议放过等自摸（自摸 ≈ 3.85 倍收炮）' : '建议收炮落袋');
      return;
    }
    if (!a || a.type !== 'turn' || a.seat !== hs) {
      el.textContent = '等待你的回合；摸牌后会按实际可打的牌重新计算';
      return;
    }
    var opts = game.evaluateDiscards(hs);
    var guide = opts.length ? getTrainingGuide(opts[0].kind, false) : null;
    if (!guide) { el.textContent = '等待出牌建议…'; return; }
    el.textContent = '牌效推荐打 ' + ZMJ.tileName(guide.kind) + ' · ' +
      (guide.shanten === 0 ? '听 ' : guide.shanten + ' 向听 · 有效进张 ') +
      guide.draws.length + ' 种 / 未见 ' + guide.total + ' 张 · 下次自摸命中约 ' +
      (guide.chanceNext * 100).toFixed(1) + '% · 点「牌况 / 提示」看推导';
  }

  function renderSeat(pos) {
    var el = $('seat' + pos);
    el.innerHTML = '';
    var seat = visSeat(pos);
    var pl = game.seats[seat];
    var H = game.hand;
    var hp = H.players[seat];
    var isMe = pl.isHuman;
    var narrow = isNarrow();
    var smallT = narrow ? 'xs' : 'small';
    var meldT = narrow ? 'xs' : 'meldTile';
    var sideSeat = (pos === 1 || pos === 3);

    if (narrow && !isMe && sideSeat) {
      // 手机端左右两家：只显示名字 + 分数（横排空间不够）
      var n1 = document.createElement('div'); n1.className = 'seatName';
      n1.innerHTML = '<span class="dot"></span><span>' + pl.name + '</span>';

      el.appendChild(n1); el.appendChild(n2);
    } else {
      var nm = document.createElement('div');
      nm.className = 'seatName';
      nm.innerHTML = '<span class="dot"></span><span>' + pl.name + '</span>' +
        '<span style="opacity:.7">' + (isMe || game.humanSeat() < 0 ? '' : '· ' + POS_NAME[pos]) + '</span>' +
        '<span style="opacity:.7">· ' + money(pl.score) + '</span>';

    }
    if (H.turn === seat && !H.over) el.classList.add('active'); else el.classList.remove('active');

    if (isMe) {
      var md = document.createElement('div'); md.className = 'melds';
      hp.melds.forEach(function (m) { md.appendChild(meldEl(m, narrow ? 'xs' : 'meldTile')); });
      el.appendChild(md);
      var row = document.createElement('div');
      row.className = 'handRow';
      var canDiscard = game.awaiting && game.awaiting.type === 'turn' && game.awaiting.seat === seat;
      var opt = game.turnOptionsFor(seat);
      if (opt && opt.canZimo && !canDiscard) row.classList.add('tenpai');
      // 刚摸到的牌单独放到最右边（其余按顺序排列）
      var drawnKind = (canDiscard && H.lastDraw != null) ? H.lastDraw : -1;
      function addTile(kk) {
        var chosen = canDiscard && selectedKind === kk;
        var t = tileEl(kk, 'big', (canDiscard ? 'clickable' : '') + (chosen ? ' chosen' : '') + (kk === drawnKind ? ' drawn' : ''));
        if (canDiscard) {
          t.setAttribute('role', 'button');
          t.setAttribute('tabindex', '0');
          t.setAttribute('aria-label', '打出' + ZMJ.tileName(kk));
          t.onclick = function () { onDiscardClick(kk); };
          t.onkeydown = function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onDiscardClick(kk); }
          };
        }
        row.appendChild(t);
      }
      for (var k = 0; k < ZMJ.KINDS; k++) {
        var cnt = hp.concealed[k] - (k === drawnKind ? 1 : 0);
        for (var c = 0; c < cnt; c++) addTile(k);
      }
      if (drawnKind >= 0) {
        var gap = document.createElement('div'); gap.className = 'gap';
        row.appendChild(gap);
        addTile(drawnKind);
      }
      el.appendChild(row);
      var dc = document.createElement('div'); dc.className = 'discards';
      hp.discards.forEach(function (k) { dc.appendChild(tileEl(k, smallT)); });
      el.appendChild(dc);
    } else {
      var md2 = document.createElement('div'); md2.className = 'melds';
      hp.melds.forEach(function (m) { md2.appendChild(meldEl(m, meldT)); });
      var bk = document.createElement('div'); bk.className = 'backRow';
      var total = 0;
      if (hp.concealedCount != null) total = hp.concealedCount;   // 联机时服务器只发张数
      else for (var kk = 0; kk < ZMJ.KINDS; kk++) total += hp.concealed[kk];
      var maxBacks = narrow ? (pos === 2 ? 12 : 5) : 13;
      var shown = Math.min(total, maxBacks);
      for (var i = 0; i < shown; i++) bk.appendChild(backEl(sideSeat ? meldT : smallT));
      if (total > shown) {
        var more = document.createElement('div');
        more.style.cssText = 'font-size:10px;color:#9fb3a8;align-self:center;padding:0 2px';
        more.textContent = '+' + (total - shown);
        bk.appendChild(more);
      }
      var wrap = document.createElement('div');
      wrap.style.display = 'flex'; wrap.style.flexDirection = 'column';
      wrap.style.gap = narrow ? '2px' : '4px';
      wrap.style.alignItems = pos === 2 ? 'center' : (pos === 1 ? 'flex-start' : 'flex-end');
      wrap.appendChild(md2); wrap.appendChild(bk);
      el.appendChild(wrap);
      var dc2 = document.createElement('div'); dc2.className = 'discards';
      dc2.style.justifyContent = pos === 2 ? 'center' : (pos === 1 ? 'flex-start' : 'flex-end');
      hp.discards.forEach(function (k) { dc2.appendChild(tileEl(k, smallT)); });
      el.appendChild(dc2);
    }
  }

  // 中央放大展示最新打出的一张牌
  var lastCenterSig = '';

  // 碰 / 杠 / 胡 / 自摸 的推荐：只用公开信息推算，和出牌推荐同一套口径
  function shantenWords(s) { return s <= 0 ? '已听牌' : (s + ' 向听'); }
  function claimAdvice() {
    var a = game.awaiting;
    if (!a || !game.hand) return null;
    var H = game.hand, seat = a.seat, p = H.players[seat];
    if (!p) return null;
    if (a.type === 'turn') {
      var o = a.options || {};
      if (o.canZimo) {
        return { main: '自摸胡！', detail: '三家各付 基础 10 元 + 鸟钱，直接收下', cls: 'good' };
      }
      if (o.anGang && o.anGang.length) {
        return { main: '建议暗杠 ' + ZMJ.tileName(o.anGang[0]),
                 detail: '三家各付 10 元，杠完从牌尾摸一张，还有杠上开花的机会', cls: 'good' };
      }
      if (o.buGang && o.buGang.length) {
        return { main: '建议补杠 ' + ZMJ.tileName(o.buGang[0]),
                 detail: '三家各付 5 元，杠完从牌尾摸一张；本规则不能抢杠', cls: 'good' };
      }
      return null;   // 没有特殊动作，交给原来的弃牌推荐
    }
    if (a.type !== 'claim') return null;
    var c = a.options || {};
    if (c.hu) {
      return { main: '胡 ' + ZMJ.tileName(c.kind),
               detail: game.nameOf(c.from) + ' 放炮，他一个人付 基础 5 元 + 鸟钱', cls: 'good' };
    }
    if (c.gang) {
      return { main: '杠 ' + ZMJ.tileName(c.kind),
               detail: game.nameOf(c.from) + ' 付 15 元，杠完从牌尾摸一张', cls: 'good' };
    }
    if (c.peng) {
      // 碰之前 / 碰之后 各算一次向听和进张，再决定值不值得碰
      var mc = p.melds.length, b4, u4, af, uf;
      try {
        b4 = ZMJ.shanten(p.concealed, mc);
        u4 = ZMJ.ukeire(p.concealed, mc, ZMJ.visiblePool(H, seat)).total;
        p.concealed[c.kind] -= 2;
        p.melds.push({ type: 'peng', kind: c.kind, from: c.from });
        af = ZMJ.shanten(p.concealed, mc + 1);
        uf = ZMJ.ukeire(p.concealed, mc + 1, ZMJ.visiblePool(H, seat)).total;
      } finally {
        // 无论算成什么样都要把手牌还原，否则会把牌局改坏
        if (p.melds.length > mc) p.melds.pop();
        p.concealed[c.kind] += 2;
      }
      var better = af < b4 || (af === b4 && uf > u4);
      return {
        main: (better ? '建议碰 ' : '建议过 ') + ZMJ.tileName(c.kind),
        detail: '不碰：' + shantenWords(b4) + ' · ' + u4 + ' 张进张　｜　碰了：' + shantenWords(af) + ' · ' + uf + ' 张进张',
        cls: better ? 'good' : ''
      };
    }
    return null;
  }

  function renderCoach() {
    var H = game.hand, a = game.awaiting, box = $('coach');
    var eyebrow = $('coachEyebrow'), main = $('coachMain'), detail = $('coachDetail');
    box.className = '';
    if (H.over && H.result) {
      eyebrow.textContent = '本局结束'; main.textContent = H.result.title;
      detail.textContent = '查看结算，然后继续下一局';
    } else if (a && a.seat === game.humanSeat()) {
      // 轮到你做决定时，推荐必须压过「上一手复盘」：
      // 否则你刚打完牌、别人打出的牌正好能碰/杠/胡，中间却还在显示上一手的复盘。
      if (a.type === 'claim') {
        var cAdv = claimAdvice();
        eyebrow.textContent = '轮到你决定';
        if (cAdv) {
          main.textContent = cAdv.main; detail.textContent = cAdv.detail;
          if (cAdv.cls) box.classList.add(cAdv.cls);
        } else {
          main.textContent = '碰、杠、胡，还是过？';
          detail.textContent = '先看牌形和剩余牌，再做选择';
        }
      } else {
        var tAdv = claimAdvice();
        eyebrow.textContent = '全桌第 ' + H.turnCount + ' 摸 · 你的回合';
        if (tAdv) {
          main.textContent = tAdv.main; detail.textContent = tAdv.detail;
          if (tAdv.cls) box.classList.add(tAdv.cls);
        } else {
          var opts = game.evaluateDiscards(a.seat);
          var guide = cfg.hint && opts.length ? getTrainingGuide(opts[0].kind, false) : null;
          main.textContent = guide ? '牌效推荐打 ' + ZMJ.tileName(guide.kind) : '观察牌形，选一张弃牌';
          detail.textContent = guide ?
            ('打后' + (guide.shanten === 0 ? '听牌' : guide.shanten + ' 向听') +
              ' · 有效 ' + guide.draws.length + ' 种 / 未见 ' + guide.total + ' 张 · 详见出牌讲解') :
            '每次摸牌后重新比较向听和有效进张';
        }
      }
    } else if (feedback && feedback.handNo === game.handNo) {
      eyebrow.textContent = '上一手复盘'; main.textContent = feedback.main;
      detail.textContent = feedback.detail;
      box.classList.add(feedback.grade);
    } else {
      eyebrow.textContent = '牌局进行中'; main.textContent = '观察对手的出牌';
      detail.textContent = '留意副露、牌河与剩余巡目';
    }
  }

  function btn(label, cls, fn) {
    var b = document.createElement('button');
    b.className = 'act ' + (cls || '');
    b.textContent = label;
    b.onclick = fn;
    return b;
  }
  function act(fn) {
    if (!fn()) return false;
    turnDeadline = 0; pauseStarted = 0;
    render(); timer = setTimeout(tick, 120);
    return true;
  }
  function discardReview(kind, opts) {
    if (!opts.length) return null;
    var best = opts[0];
    var picked = opts.filter(function (o) { return o.kind === kind; })[0];
    if (!picked) return null;
    var same = picked.kind === best.kind;
    var main = same ? '与牌效推荐一致' :
      (picked.shanten > best.shanten ? '这手增加了 ' + (picked.shanten - best.shanten) + ' 向听' :
        picked.ukeire < best.ukeire ? '比推荐少 ' + (best.ukeire - picked.ukeire) + ' 张进张' : '牌效接近推荐');
    var detail = '你打 ' + ZMJ.tileName(kind) + '；牌效推荐 ' + ZMJ.tileName(best.kind) +
      '（' + best.shanten + ' 向听，进张 ' + best.ukeire + '）';
    if (cfg.analyze) {
      try {
        var sit = getSituation();
        var res = sit && sit.res;
        if (res) detail += '；该张采样放铳风险约 ' + (res.dealIn(kind).prob * 100).toFixed(1) + '%';
      } catch (e) {}
    }
    return { handNo: game.handNo, main: main, detail: detail, grade: same ? 'good' : 'warn' };
  }
  function onDiscardClick(kind) {
    if (!game.awaiting || game.awaiting.type !== 'turn') return;
    // 触屏：第一次点选、再点同一张才打出，避免误触
    if (isTouch && selectedKind !== kind) { selectedKind = kind; render(); return; }
    var opts = game.evaluateDiscards(game.awaiting.seat);
    var review = discardReview(kind, opts);
    selectedKind = null;
    if (act(function () { return game.humanDiscard(kind); })) {
      if (handExtra && opts.length) {
        handExtra.recTotal++;
        if (opts[0].kind === kind) handExtra.recFollow++;
      }
      feedback = review;
      renderCoach();
    }
  }

  function renderHint() {
    var el = $('hint');
    if (!cfg.hint) { el.innerHTML = '<span style="color:#9fb3a8">提示已关闭</span>'; return; }
    var hs = game.humanSeat();
    if (hs < 0) { el.innerHTML = '<span style="color:#9fb3a8">你在等待区，先看看别人怎么打。</span>'; return; }
    var H = game.hand, p = H.players[hs], a = game.awaiting;
    var rows = [];
    // 胡牌抉择提示
    if (a && a.type === 'claim' && a.options.hu) {
      var outs = game.ukeireFor(hs).total;
      var left = game.drawsLeft();
      var prob = selfDrawProb(outs + 1, left, Math.max(H.wall.length, 8));
      var threat = 0;
      for (var t = 0; t < 4; t++) if (t !== hs && H.players[t].melds.length >= 2) threat++;
      var need = outs >= 8 ? 2 : outs >= 6 ? 3 : outs >= 4 ? 4 : outs >= 3 ? 5 : 8;
      if (threat >= 2) need += 2;
      var shouldPass = outs >= 2 && left >= need;
      rows.push('<b>该不该收炮？</b>');
      rows.push('未见和牌张数：<b>' + outs + '</b> 张 · 还能摸约 <b>' + left + '</b> 次 · 自摸概率粗估 <b>' + Math.round(prob * 100) + '%</b>');
      rows.push('收炮 = 基础 5 + 鸟钱（均 17.7 元）｜自摸 = 每家 10 + 鸟钱，三家共 <b>68 元 ≈ 3.85 倍</b>');
      rows.push(shouldPass
        ? '<span class="rec">建议：放过，等自摸。</span><span class="warn">（放过后本巡转完前不能再要炮）</span>'
        : '<span class="rec">建议：收炮落袋。</span>（巡目不足或听牌太窄）');
      el.innerHTML = rows.join('<br>');
      return;
    }
    if (!a || a.type !== 'turn' || a.seat !== hs) {
      el.innerHTML = '<span style="color:#c7d8cd">摸到牌、轮到你出牌时，这里会按每个弃牌选择重新计算。</span>';
      return;
    }
    var opts = game.evaluateDiscards(hs);
    var guide = opts.length ? getTrainingGuide(opts[0].kind, true) : null;
    if (!guide) { el.textContent = '当前没有可计算的弃牌。'; return; }
    var stateName = guide.shanten === 0 ? '听牌' : guide.shanten + ' 向听';
    var hitName = guide.shanten === 0 ? '和牌张' : '有效进张';
    rows.push('<div class="guideLead">牌效推荐打 ' + ZMJ.tileName(guide.kind) + ' → ' + stateName + '</div>');
    rows.push('<div class="guideNote">向听是离听牌的牌形距离，0 向听就是已听牌；有效进张是下一摸能降低向听的牌。推荐先比较向听，再比较未见有效张数；放铳风险另列。</div>');
    rows.push('<div class="guideStep">① 打后会等哪些牌？</div>');
    rows.push('<div>共 <b>' + guide.draws.length + '</b> 种' + hitName + '，未见 <b>' + guide.total + '</b> 张：</div>');
    rows.push('<div class="guideTiles">' + (guide.draws.length ? guide.draws.map(function (d) {
      return '<span>' + ZMJ.tileName(d.kind) + ' × ' + d.count + '</span>';
    }).join('') : '<span>暂无可见的有效张</span>') + '</div>');
    rows.push('<div class="guideMath">下一次自己摸到' + hitName + '的基准概率：' +
      guide.total + ' ÷ ' + guide.unknown + ' 张未见牌 ≈ <b>' +
      (guide.chanceNext * 100).toFixed(1) + '%</b></div>');
    rows.push('<div class="guideStep">② 为什么比其他弃牌好？</div>');
    rows.push('<div class="guideCompare"><b>弃牌</b><b>打后</b><b>未见' + hitName + '</b>');
    opts.slice(0, 3).forEach(function (o) {
      var g = getTrainingGuide(o.kind, false);
      rows.push('<span>' + ZMJ.tileName(o.kind) + (o.kind === guide.kind ? ' ★' : '') +
        '</span><span>' + (g.shanten === 0 ? '听牌' : g.shanten + ' 向听') +
        '</span><span>' + (g.shanten === guide.shanten ? g.total + ' 张' : '不同阶段') + '</span>');
    });
    rows.push('</div>');
    if (opts.length > 1) {
      var second = getTrainingGuide(opts[1].kind, false);
      if (second.shanten > guide.shanten) {
        rows.push('<div class="guideNote">例如打 ' + ZMJ.tileName(second.kind) + ' 会退到 ' +
          second.shanten + ' 向听；不同向听阶段的进张数字不能直接比较。</div>');
      } else if (second.total < guide.total) {
        rows.push('<div class="guideNote">同样是 ' + stateName + '，打 ' + ZMJ.tileName(guide.kind) +
          ' 比打 ' + ZMJ.tileName(second.kind) + ' 多 ' + (guide.total - second.total) +
          ' 张未见' + hitName + '。</div>');
      } else {
        rows.push('<div class="guideNote">前两种弃牌的向听和进张相同；排序还参考公开牌推断的弃牌危险度，不代表确定安全。</div>');
      }
    }
    rows.push('<div class="guideStep">③ 接下来怎么做牌？</div>');
    if (guide.shanten === 0) {
      rows.push('<div>这 13 张已经听牌。等上方列出的牌即可和牌；听口越宽，通常下次摸中的机会越大。</div>');
    } else if (guide.shanten === 1 && guide.paths.length) {
      rows.push('<div>下面是摸到有效牌后的较宽听口路线，实际摸牌后可再调整：</div>');
      guide.paths.slice(0, 3).forEach(function (path) {
        rows.push('<div class="guidePath">摸 <b>' + ZMJ.tileName(path.draw) + '</b>（未见 ' + path.drawCount +
          ' 张）→ 再打 <b>' + ZMJ.tileName(path.discard) + '</b> → 听 <b>' +
          path.waits.map(function (w, i) { return ZMJ.tileName(w) + '×' + path.waitCounts[i]; }).join('、') +
          '</b>（合计未见 ' + path.waitTotal + ' 张；静态模型下再摸中约 ' +
          (guide.unknown > 1 ? (path.waitTotal / (guide.unknown - 1) * 100).toFixed(1) : '0.0') + '%）</div>');
      });
      rows.push('<div class="guideNote">这里为每种示例摸牌寻找能保持听牌且未见听张最多的下一张弃牌；不含放铳风险。</div>');
    } else {
      rows.push('<div>先争取摸到上方的有效牌，把 ' + guide.shanten + ' 向听推进到 ' +
        (guide.shanten - 1) + ' 向听。每次摸牌后重新比较弃牌，优先保留能接纳更多未见牌的搭子和对子。</div>');
    }
    var after = p.concealed.slice(); after[guide.kind]--;
    rows.push('<details><summary>向听、进张与概率怎么算？</summary>' +
      '<div>0 向听表示再来一张和牌张就能胡；1 向听表示先摸到有效牌、调整弃牌后可以听牌。' +
      '普通牌型按四组面子加一对将，小七对单独计算，取较近的路线。</div>' +
      '<div>本选择：普通牌型 ' + ZMJ.shantenStandard(after, p.melds.length) + ' 向听' +
      (p.melds.length ? '' : '；小七对 ' + ZMJ.shantenSevenPairs(after) + ' 向听') + '。</div>' +
      '<div>有效进张是下一摸能降低向听的牌；听牌时则是能直接和牌的牌。每种牌原有四张，减去自己手牌与公开牌，得到“未见张数”。</div>' +
      '<div>上面的概率按未见牌均匀分布计算，只描述下一次自摸；未见牌也可能在对手暗牌或预留鸟牌里，牌河变化后要重算。</div>' +
      '<div>术语参考：<a href="https://arxiv.org/abs/2108.06832" target="_blank" rel="noopener noreferrer">向听数的研究论文</a>、' +
      '<a href="https://github.com/tomohxx/necessary-and-unnecessary-tiles" target="_blank" rel="noopener noreferrer">有效牌的开源计算示例</a>。</div></details>');
    el.innerHTML = rows.join('');
  }

  function startReplay(rec) {

  function renderReplay() {
    var box = $('modalBox');
    var r = rp.rec, hs = (r.humanSeat == null ? 0 : r.humanSeat);
    var st = rp.states[rp.i];
    box.innerHTML = '';
    var h2 = document.createElement('h2');
    h2.textContent = '第 ' + r.no + ' 局 · 第 ' + rp.i + ' / ' + (rp.states.length - 1) + ' 步';

    line.style.cssText = 'font-size:13px;color:#f2c14e;margin-bottom:6px';
    line.textContent = rp.i === 0 ? '开局' : (st.actor >= 0 ? r.names[st.actor] + ' ' + st.desc : st.desc) +
      (st.actor === hs ? '（轮到你）' : '');

    // 我的手牌

    lbl.style.cssText = 'font-size:12px;color:#9fb3a8;margin:6px 0 3px';
    lbl.textContent = '你的手牌' + (st.melds[hs].length ? '（副露 ' + st.melds[hs].length + ' 组）' : '') + '：';
    box.appendChild(lbl);
    box.appendChild(tilesRow(st.hands[hs], ''));
    if (st.melds[hs].length) {
      var mr = document.createElement('div'); mr.className = 'melds';
      st.melds[hs].forEach(function (m) {
        var d = document.createElement('div'); d.className = 'meld';
        for (var i2 = 0; i2 < (m.type === 'gang' ? 4 : 3); i2++) d.appendChild(tileEl(m.kind, 'meldTile'));
        mr.appendChild(d);
      });
      box.appendChild(mr);
    }
    // 三家牌河
    var ob = document.createElement('div');
    ob.style.cssText = 'margin-top:10px;font-size:12px;color:#9fb3a8;line-height:1.9';
    [0, 1, 2, 3].forEach(function (s) {
      if (s === hs) return;
      var l2 = document.createElement('div');
      l2.textContent = r.names[s] + '（副露 ' + st.melds[s].length + '）　' +
        (st.discards[s].slice(-14).map(ZMJ.tileName).join(' ') || '—');
      ob.appendChild(l2);
    });
    box.appendChild(ob);
    // 若这一步是我打牌 → 给出当时的推荐与放铳概率
    if (st.actor === hs && st.desc.indexOf('打出') === 0 && rp.i > 0) {
      var pre = rp.states[rp.i - 1];
      try {
        var hd = ZMJ.stateAsHand(pre, hs);
        var cands = ZMJ.evaluateDiscards(hd, hs).slice(0, 5);
        if (cands.length) {
          var sit = ZMJ.analyzeSituation(hd, hs, { worlds: 150, seed: (r.no * 977 + rp.i * 31) >>> 0 });
          var rec0 = cands[0].kind;
          var mineP = sit.dealIn(st.kind).prob;
          var recP = sit.dealIn(rec0).prob;
          var same = st.kind === rec0;
          var v = document.createElement('div');
          v.style.cssText = 'margin-top:10px;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.8;background:' +
            (same ? 'rgba(76,196,124,.15)' : 'rgba(255,154,139,.13)') + ';color:' + (same ? '#7ee2a8' : '#ff9a8b');
          v.innerHTML = (same ? '✅ 与推荐一致' : '⚠️ 当时推荐打 ' + ZMJ.tileName(rec0) + '，你打了 ' + ZMJ.tileName(st.kind)) +
            '<br>你那张的放铳概率 ' + (mineP * 100).toFixed(1) + '%　推荐那张 ' + (recP * 100).toFixed(1) + '%' +
            (mineP > recP + 0.005 ? '　（多担 ' + ((mineP - recP) * 100).toFixed(1) + ' 个百分点）' : '');
          box.appendChild(v);
        }
      } catch (err) {}
    }
    var wrap = document.createElement('div'); wrap.className = 'center';
    function mk(txt, fn, cls) { var b = document.createElement('button'); b.className = 'act ' + (cls || ''); b.textContent = txt; b.onclick = fn; return b; }
    wrap.appendChild(mk('⏮ 开局', function () { rp.i = 0; renderReplay(); }, 'pass'));
    wrap.appendChild(mk('◀ 上一步', function () { if (rp.i > 0) { rp.i--; renderReplay(); } }, 'pass'));
    wrap.appendChild(mk('下一步 ▶', function () { if (rp.i < rp.states.length - 1) { rp.i++; renderReplay(); } }));
    wrap.appendChild(mk('换一局', function () { showReplayList(); }, 'pass'));
    wrap.appendChild(mk('关闭', function () { $('modal').classList.add('hidden'); }, 'pass'));
    box.appendChild(wrap);
    $('modal').classList.remove('hidden');
  }
  // ---------- 防守道场：只练「少放铳」（调研显示这是水平提升的主要来源） ----------
  var dojo = { sc: null, answered: false, picked: -1 };
  function dojoNew() {
    var sc = null;
    for (var i = 0; i < 3 && !sc; i++) {
      try { sc = ZMJ.makeScenario((Math.random() * 2000000000) >>> 0, { minTurn: 8, maxShanten: 2 }); } catch (e) { sc = null; }
    }

    renderDojo();
  }
  function tilesRow(counts, cls, onClick) {
    var row = document.createElement('div');

    for (var k = 0; k < ZMJ.KINDS; k++) {
      for (var c = 0; c < counts[k]; c++) {
        var t = tileEl(k, 'mid', cls || '');
        if (onClick) t.onclick = (function (kk) { return function () { onClick(kk); }; })(k);
        row.appendChild(t);
      }
    }
    return row;

        (mine ? (mine.pDeal * 100).toFixed(1) + '%' : '—') +
        (extra > 0.005 ? '（比推荐多担 ' + (extra * 100).toFixed(1) + ' 个百分点）' : '');

  function answerDojo(kind) {

    sc.candidates.forEach(function (c) { if (c.kind === kind) mine = c; });
    STATS.dojoN = (STATS.dojoN || 0) + 1;
    if (kind === sc.best) STATS.dojoSame = (STATS.dojoSame || 0) + 1;
    if (mine) STATS.dojoRiskSum = (STATS.dojoRiskSum || 0) + Math.max(0, mine.pDeal - best.pDeal);
    saveStats();
    sfx(kind === sc.best ? 'draw' : 'meld');
    renderDojo();
  }
  // ---------- 训练统计看板（放铳率为核心指标：调研显示水平提升几乎全部来自少放铳） ----------
  function sparkline(vals) {
    if (!vals.length) return '';
    var w = 260, h = 46, mx = Math.max(20, Math.max.apply(null, vals.map(Math.abs)));
    var bw = Math.max(2, w / vals.length - 1.5);
    var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:46px" preserveAspectRatio="none">';
    out += '<line x1="0" y1="' + (h / 2) + '" x2="' + w + '" y2="' + (h / 2) + '" stroke="rgba(255,255,255,.18)" stroke-width="1"/>';
    vals.forEach(function (v, i) {
      var bh = Math.abs(v) / mx * (h / 2 - 2);
      var x = i * (w / vals.length);
      var y = v >= 0 ? (h / 2 - bh) : (h / 2);
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + (v >= 0 ? '#4cc47c' : '#ff9a8b') + '"/>';
    });
    return out + '</svg>';
  }

      ['每局开杠', sum.gangPerHand.toFixed(2) + ' 次', '暗杠 ' + STATS.gangAn + ' / 大明杠 ' + STATS.gangMing + ' / 补杠 ' + STATS.gangBu],
      ['防守道场', String(STATS.dojoN || 0) + ' 题', STATS.dojoN ? ('一致率 ' + Math.round((STATS.dojoSame || 0) / STATS.dojoN * 100) + '%，平均多担风险 ' + ((STATS.dojoRiskSum || 0) / STATS.dojoN * 100).toFixed(1) + ' 个百分点') : '还没练过'],

    html += '<table style="width:100%;border-collapse:collapse;font-size:13.5px">';
    rows.forEach(function (r, i) {

    html += '<div style="margin-top:10px;color:#9fb3a8;font-size:12px">鸟数分布（0~6 只）</div><div style="font-size:12.5px;color:#cfd8d3">' + sum.birdHist.join(' / ') + '</div>';
    html += '<div class="center"><button class="act pass" id="btnStatsReset">清空统计</button> <button class="act" id="btnStatsClose">关闭</button></div>';

  // ---------- 牌谱导出 ----------

  // ================= 联机（服务端权威） =================
  // 联机时牌局跑在服务器上，浏览器只做两件事：提交自己的操作、把收到的状态画出来。
  // 服务器只发「你自己的暗牌 + 所有人公开的牌」，所以提示/进张/放铳概率照样能用，
  // 但谁都拿不到别人的手牌（连网络流量里也没有）。
  var NET_KEY = 'zmj_net_v1';
  var NET = { ws: null, status: 'off', err: '', note: '', state: null, lobby: null,
              room: '', name: '', server: '', token: '', pid: '', wantRoom: '', retry: 0 };
  try {
    var savedNet = JSON.parse(localStorage.getItem(NET_KEY) || 'null');
    if (savedNet) { NET.name = savedNet.name || ''; NET.server = savedNet.server || ''; }
  } catch (e) {}
  function netSaveCfg() {
    try { localStorage.setItem(NET_KEY, JSON.stringify({ name: NET.name, server: NET.server })); } catch (e) {}
  }
  function netEsc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function netURL() {
    var s = String(NET.server || '').trim();
    if (s) {
      if (/^wss?:\/\//i.test(s)) return s.replace(/\/+$/, '');
      if (/^https?:\/\//i.test(s)) return s.replace(/^http/i, 'ws').replace(/\/+$/, '');
      return (location.protocol === 'https:' ? 'wss://' : 'ws://') + s.replace(/^\/+/, '').replace(/\/+$/, '');
    }
    // 直接双击打开的本地文件没有服务器，默认连本机的 8000 端口
    if (location.protocol === 'file:') return 'ws://127.0.0.1:8000/ws';
    var host = location.hostname || '127.0.0.1';
    var port = location.port ? ':' + location.port : '';
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + host + port + '/ws';
  }
  var netBarEl = null;
  function netBar() {
    if (!netBarEl) {
      // 放在工具栏里跟着排版走：以前悬浮在顶部中间会压住四家的分数条
      netBarEl = document.createElement('span');
      netBarEl.id = 'netBar';
      netBarEl.style.cssText = 'display:none;align-items:center;gap:6px;padding:3px 10px;' +
        'border-radius:999px;font-size:12px;line-height:1.5;cursor:pointer;white-space:nowrap;' +
        'background:rgba(94,201,138,.14);border:1px solid rgba(94,201,138,.45);color:#d9f2e4';
      netBarEl.title = '点这里打开联机面板';
      netBarEl.onclick = showNet;
      var bar = document.querySelector('.tools');
      if (bar) bar.appendChild(netBarEl);
      else { netBarEl.style.position = 'fixed'; netBarEl.style.right = '8px'; netBarEl.style.top = '8px'; netBarEl.style.zIndex = '60'; document.body.appendChild(netBarEl); }
    }
    var show = NET.status === 'connecting' || NET.status === 'on' || NET.status === 'error';
    if (!show) { netBarEl.style.display = 'none'; return; }
    var txt, dot;
    if (NET.status === 'connecting') { txt = '正在连接联机服务器…'; dot = '#f2c14e'; }
    else if (NET.status === 'error') { txt = NET.err || '连接出问题'; dot = '#e2685a'; }
    else if (!NET.room) { txt = '已连上联机服务器'; dot = '#5ec98a'; }
    else {
      var st = NET.state;
      var mine = st && st.you ? st.you : null;
      var where = mine && mine.queued ? '等待区' : '桌上';
      txt = '房间 ' + NET.room + ' · ' + (NET.name || '我') + '（' + where + '）';
      dot = '#5ec98a';
    }
    netBarEl.innerHTML = '';
    var d = document.createElement('span');
    d.style.cssText = 'width:7px;height:7px;border-radius:50%;background:' + dot + ';flex:0 0 auto';
    var t = document.createElement('span');
    t.textContent = txt;
    netBarEl.appendChild(d); netBarEl.appendChild(t);
    netBarEl.style.display = 'inline-flex';
  }
  function netToast(msg) {
    NET.note = msg;
    var el = $('netToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'netToast';
      el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:80;' +
        'padding:8px 14px;border-radius:10px;font-size:13px;background:rgba(12,26,20,.95);color:#ffe6a8;' +
        'border:1px solid rgba(242,193,78,.5);max-width:86vw;text-align:center';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(netToast.t);
    netToast.t = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }

  function netSend(obj) {
    if (!NET.ws || NET.ws.readyState !== 1) { netToast('还没连上服务器'); return false; }
    try { NET.ws.send(JSON.stringify(obj)); return true; }
    catch (e) { netToast('发送失败：' + e.message); return false; }
  }

  function netConnect(done) {
    if (NET.ws && (NET.ws.readyState === 0 || NET.ws.readyState === 1)) { if (done) done(); return; }
    var url = netURL();
    NET.status = 'connecting'; NET.err = ''; netBar(); if ($('netBox')) renderNet();
    var ws;
    try { ws = new WebSocket(url); }
    catch (e) { NET.status = 'error'; NET.err = '服务器地址不对：' + url; netBar(); if ($('netBox')) renderNet(); return; }
    NET.ws = ws;
    ws.onopen = function () {
      NET.status = 'on'; NET.retry = 0; NET.err = ''; NET.everConnected = true;
      netBar();
      if (NET.room) netJoin(NET.room, NET.name, NET.token);   // 断线重连：自动回到原来的房间
      else netSend({ t: 'rooms' });
      if (done) done();
    };
    ws.onmessage = function (ev) {
      var m = null;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      onNetMessage(m);
    };
    ws.onclose = function () {
      NET.ws = null;
      if (NET.status === 'error') { netBar(); return; }
      NET.status = 'error';
      // 从没连上过 = 地址不对或没有服务；连上过又断 = 掉线。两种提示不能混。
      NET.err = NET.everConnected
        ? '与服务器断开了，正在自动重连…'
        : '连不上 ' + url + '。这个网页本身不带牌局，需要有一台电脑在跑 node server.js，把它的地址填在下面。';
      netBar();
      if (NET.room && NET.retry < 5) {          // 掉线自动重连
        NET.retry++;
        setTimeout(function () { if (NET.room) netConnect(); }, 800 * NET.retry);
      } else if (NET.room) {
        netToast('已断开，点「联机」可以手动重连');
      }
      if ($('netBox')) renderNet();
    };
    ws.onerror = function () { NET.err = '连不上 ' + url; };
  }

  function netJoin(room, name, token) {
    return netSend({ t: 'join', room: room, name: name, token: token || undefined, create: true });
  }

  function netLeave() {
    if (NET.ws && NET.ws.readyState === 1) netSend({ t: 'leave' });
    NET.room = ''; NET.token = ''; NET.state = null;
    NET.status = NET.ws ? 'on' : 'off';
    netBar();
    if (game && game.online) { game = null; newGame(); }   // 回到单机
    if ($('netBox')) renderNet();
  }

  // ---------- 代理牌局：形状与单机 game 完全一致，界面代码一行都不用改 ----------
  function makeProxyGame() {
    var P = {
      online: true, seats: [], queue: [], hand: null, awaiting: null, lastResult: null,
      logs: [], handNo: 0, dealer: 0, records: [], fastForward: false, mySeat: -1, lastRecord: null
    };
    P.humanSeat = function () { return P.mySeat; };
    P.nameOf = function (seat) { return (P.seats[seat] && P.seats[seat].name) || ('座位' + ((seat | 0) + 1)); };
    P.aiStep = function () { return false; };            // 电脑由服务器驱动
    P.hasPendingResolve = function () { return false; };
    P.resolvePending = function () { return false; };
    P.startHand = function () { netSend({ t: 'start' }); };
    P.nextHand = function () { netSend({ t: 'next' }); };
    P.humanDiscard = function (kind) { return netSend({ t: 'act', act: 'discard', kind: kind }); };
    P.humanClaim = function (act, kind) { return netSend({ t: 'act', act: act, kind: kind }); };
    P.humanGang = function (kind, type) {
      return netSend({ t: 'act', act: type === 'an' ? 'angang' : 'bugang', kind: kind });
    };
    P.humanZimo = function () { return netSend({ t: 'act', act: 'zimo' }); };
    P.setAiStyle = function () {};
    P.drawsLeft = function () { return P.hand ? Math.floor(P.hand.wall.length / 4) : 0; };
    P.turnOptionsFor = function (seat) {
      var a = P.awaiting;
      if (a && a.type === 'turn' && (seat == null || seat === a.seat)) return a.options;
      return { canZimo: false, anGang: [], buGang: [], tile: null };
    };
    P.evaluateDiscards = function (seat) {
      var s = (seat == null ? P.mySeat : seat);
      if (!P.hand || s < 0) return [];
      try { return ZMJ.evaluateDiscards(P.hand, s); } catch (e) { return []; }
    };
    P.ukeireFor = function (seat) {
      var s = (seat == null ? P.mySeat : seat);
      if (!P.hand || s < 0) return { total: 0, kinds: [] };
      var p = P.hand.players[s];
      try { return ZMJ.ukeire(p.concealed, p.melds.length, ZMJ.visiblePool(P.hand, s)); }
      catch (e) { return { total: 0, kinds: [] }; }
    };
    P.sevenPairsShanten = function () {
      if (!P.hand || P.mySeat < 0) return 99;
      try { return ZMJ.shantenSevenPairs(P.hand.players[P.mySeat].concealed); } catch (e) { return 99; }
    };
    P.exportRecords = function () {
      return { game: '转转麻将（联机）', version: 3, exportedAt: new Date().toISOString(),
               rules: ZMJ.RULES || null, hands: P.records };
    };
    P.exportText = function () {
      var L = ['转转麻将 · 联机牌谱  ' + new Date().toLocaleString(), '房间 ' + NET.room, ''];
      for (var i = 0; i < P.records.length; i++) {
        var r = P.records[i], res = r.result || {};
        L.push('第 ' + r.no + ' 局：' + (res.title || '') +
          '  收支 ' + (res.deltas || []).join(' / '));
      }
      if (P.records.length === 0) L.push('（本次联机还没有打完一局）');
      return L.join('\n');
    };
    P.applyView = function (v) {
      NET.state = v;
      P.mySeat = (v.you && typeof v.you.seat === 'number') ? v.you.seat : -1;
      var rs = (v.room && v.room.seats) ? v.room.seats : [];
      P.seats = [];
      for (var i = 0; i < 4; i++) {
        var s = rs[i];
        // 还没开局时服务器不发座位，这里必须给占位对象：界面会直接读 seats[i].isHuman
        P.seats.push(s ? { name: s.name, score: s.score, isHuman: !!s.isHuman, online: !!s.online,
                           zimoCount: s.zimoCount, paoCount: s.paoCount,
                           handsWon: s.handsWon, handsPlayed: s.handsPlayed }
                       : { name: '空位', score: 0, isHuman: false, online: true,
                           zimoCount: 0, paoCount: 0, handsWon: 0, handsPlayed: 0 });
      }
      P.queue = [];
      var q = (v.room && v.room.queue) ? v.room.queue : [];
      for (var j = 0; j < q.length; j++) P.queue.push({ name: q[j].name, isHuman: !!q[j].isHuman });
      P.handNo = v.room ? v.room.handNo : 0;
      if (!v.hand) { P.hand = null; P.awaiting = null; P.lastResult = null; return; }
      var h = v.hand;
      P.dealer = h.dealer;
      P.awaiting = h.awaiting
        ? { type: h.awaiting.type, seat: P.mySeat, options: h.awaiting.options, tile: h.awaiting.tile }
        : null;
      var players = [];
      for (var s2 = 0; s2 < 4; s2++) {
        var pub = h.players[s2] || {};
        var mineHere = h.mine && h.mine.seat === s2;
        var cons = [];
        for (var k = 0; k < ZMJ.KINDS; k++) cons.push(mineHere ? (h.mine.concealed[k] || 0) : 0);
        players.push({
          concealed: cons,
          concealedCount: pub.concealedCount,                 // 界面画对手的牌背时用这个
          melds: (pub.melds || []).slice(),
          discards: (pub.discards || []).slice(),
          passedWin: !!pub.passedWin
        });
      }
      P.hand = {
        players: players,
        wall: { length: h.wallLeft },                          // 牌墙只给张数，顺序不出服务器
        turn: h.turn, lastDraw: h.lastDraw, lastDiscard: h.lastDiscard,
        turnCount: h.turnCount, over: !!h.over,
        result: v.result || null,
        birds: (v.result && v.result.birds) ? v.result.birds : []
      };
      P.lastResult = v.result || null;
      P.logs = (v.logs || []).slice();
      if (v.record) {
        var last = P.records.length ? P.records[P.records.length - 1] : null;
        if (!last || last.no !== v.record.no) P.records.push(v.record);
        P.lastRecord = v.record;
      }
    };
    return P;
  }

  var proxyGame = null;
  function netUseProxy() {
    if (game && game.online) return game;
    if (!proxyGame) proxyGame = makeProxyGame();
    clearTimeout(timer);
    turnDeadline = 0; pauseStarted = 0; lastAwaiting = null; feedback = null; selectedKind = null;
    guideCache = { key: '', entries: {} };
    sitCache = { key: '', data: null, cands: null };
    sfxSig = { disc: '', meld: '', drawn: -1, over: '' };
    settledHandNo = 0;
    loadStats();
    game = proxyGame;
    window.__zmjGame = game;
    return game;
  }

  function onNetMessage(m) {
    if (!m || !m.t) return;
    if (m.t === 'welcome' || m.t === 'rooms') { NET.lobby = m.rooms || null; if ($('netBox')) renderNet(); return; }
    if (m.t === 'joined') {
      NET.room = m.room; NET.token = m.token; NET.pid = m.pid;
      if (m.you) NET.name = m.you;
      netSaveCfg();
      netToast('进入房间 ' + m.room);
      netBar();
      if ($('netBox')) renderNet();
      return;
    }
    if (m.t === 'left') { NET.room = ''; NET.state = null; netBar(); if ($('netBox')) renderNet(); return; }
    if (m.t === 'err') { netToast(m.msg); NET.err = m.msg; if ($('netBox')) renderNet(); return; }
    if (m.t === 'pong') return;
    if (m.t === 'chat') { netToast(m.from + '：' + m.text); return; }
    if (m.t === 'state') {
      var P = netUseProxy();
      P.applyView(m);
      netBar();
      render();
      tick();
      if ($('netBox')) renderNet();
      return;
    }
  }

  // ---------- 联机面板 ----------
  function showNet() {
    netOpenBox();
    if (NET.status === 'off' || NET.status === 'error') {
      if (!NET.wantRoom) {
        try {
          var q = new URLSearchParams(location.search).get('room');
          if (q) NET.wantRoom = q;
        } catch (e) {}
      }
      if (NET.status === 'off') netConnect();
      else { NET.status = 'off'; netConnect(); }
    }
    renderNet();
    $('modal').classList.remove('hidden');
  }

  function renderNet() {
    if (!$('netBox')) return;
    var box = $('netBox');
    var h = '';
    if (NET.status !== 'on') {
      h += '<div style="font-size:13px;color:#cfd8d3;line-height:1.7;margin-bottom:8px">' +
        '联机需要一台跑着 <b style="color:#f2c14e">node server.js</b> 的电脑（局域网里任意一台就行）。' +
        '在 GitHub Pages 上打开时，请在下面填那台电脑的地址。</div>' +
        '<div style="font-size:13px;color:#ffcf7a;min-height:20px">' + netEsc(NET.err || '正在连接…') + '</div>' +
        '<div style="font-size:12px;color:#9fb3a8;margin-top:8px">服务器地址</div>' +
        '<input id="netServer" value="' + netEsc(NET.server) + '" placeholder="留空 = 当前网址；也可填 192.168.1.5:8000" ' +
        'style="width:100%;box-sizing:border-box;padding:9px;border-radius:9px;border:1px solid #33584a;' +
        'background:rgba(0,0,0,.3);color:#e8f3ec;font-size:14px">';
      h += '<div class="center" style="margin-top:12px"><button class="act" id="netRetry">重新连接</button> ' +
        '<button class="act pass" id="netClose">关闭</button></div>';
      box.innerHTML = h;
      $('netRetry').onclick = function () {
        var v = $('netServer').value;
        NET.server = v;
        netSaveCfg();
        if (NET.ws) { try { NET.ws.close(); } catch (e) {} NET.ws = null; }
        netConnect();
      };
      $('netClose').onclick = function () { $('modal').classList.add('hidden'); };
      return;
    }
    if (!NET.room) {
      h += '<div style="font-size:13px;color:#cfd8d3;line-height:1.7">连上了服务器。开一间房，把房间号告诉朋友；' +
        '人数不够时空座位由电脑补上。</div>' +
        '<div style="font-size:12px;color:#9fb3a8;margin-top:10px">你的名字</div>' +
        '<input id="netName" maxlength="12" value="' + netEsc(NET.name || '') + '" ' +
        'style="width:100%;box-sizing:border-box;padding:9px;border-radius:9px;border:1px solid #33584a;' +
        'background:rgba(0,0,0,.3);color:#e8f3ec;font-size:14px">' +
        '<div style="font-size:12px;color:#9fb3a8;margin-top:10px">房间号（留空 = 新开一间）</div>' +
        '<input id="netRoomIn" maxlength="8" value="' + netEsc(NET.wantRoom || '') + '" ' +
        'style="width:100%;box-sizing:border-box;padding:9px;border-radius:9px;border:1px solid #33584a;' +
        'background:rgba(0,0,0,.3);color:#e8f3ec;font-size:14px">';
      var list = NET.lobby || [];
      if (list.length) {
        h += '<div style="font-size:12px;color:#9fb3a8;margin-top:12px">进行中的房间</div>';
        for (var i = 0; i < list.length && i < 6; i++) {
          h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;' +
            'border-bottom:1px solid rgba(255,255,255,.07);font-size:13px">' +
            '<span>房间 <b style="color:#f2c14e">' + netEsc(list[i].id) + '</b> · ' +
            (list[i].phase === 'playing' ? '打牌中' : '等人') + ' · ' + list[i].online + ' 人在线</span>' +
            '<button class="act" data-room="' + netEsc(list[i].id) + '" style="padding:3px 10px;font-size:12px">加入</button></div>';
        }
      }
      h += '<div class="center" style="margin-top:12px"><button class="act" id="netEnter">进入房间</button> ' +
        '<button class="act pass" id="netClose2">关闭</button></div>';
      box.innerHTML = h;
      var joinIt = function (rid) {
        var nm = $('netName').value || '';
        NET.name = nm;
        NET.wantRoom = rid || '';
        netSaveCfg();
        netJoin(rid || '', nm, '');
      };
      $('netEnter').onclick = function () { joinIt($('netRoomIn').value.trim()); };
      $('netClose2').onclick = function () { $('modal').classList.add('hidden'); };
      var btns = box.querySelectorAll('button[data-room]');
      for (var b = 0; b < btns.length; b++) {
        btns[b].onclick = function () { joinIt(this.getAttribute('data-room')); };
      }
      return;
    }
    // 已在房间里
    var st = NET.state;
    h += '<div style="font-size:13px;color:#cfd8d3">房间 <b style="color:#f2c14e">' + netEsc(NET.room) + '</b>' +
      (st && st.room && st.room.phase === 'playing' ? ' · 第 ' + st.room.handNo + ' 局' : ' · 还没开局') + '</div>';
    if (st && st.room) {
      h += '<div style="margin-top:8px;font-size:13px;line-height:1.9">';
      for (var s = 0; s < st.room.seats.length; s++) {
        var seat = st.room.seats[s];
        if (!seat) continue;
        var me = st.you && st.you.seat === s;
        h += '<div>' + (me ? '<b style="color:#f2c14e">▶ </b>' : '') + netEsc(seat.name) +
          (seat.isHuman ? '' : '（电脑）') + (seat.isHuman && !seat.online ? ' <span style="color:#e2685a">掉线托管中</span>' : '') +
          ' <span style="color:#9fb3a8">' + seat.score + ' 元</span></div>';
      }
      if (st.room.queue.length) {
        h += '<div style="font-size:12px;color:#9fb3a8;margin-top:6px">等待区：' +
          st.room.queue.map(function (q) { return netEsc(q.name) + (q.isHuman ? '' : '(电脑)'); }).join('、') + '</div>';
      }
      if (st.you && st.you.queued) {
        h += '<div style="font-size:12px;color:#ffcf7a;margin-top:6px">你在等待区，这一局结束后轮到你上桌</div>';
      }
    }
    h += '</div>';
    h += '<div class="center" style="margin-top:12px">';
    if (!st || !st.room || st.room.phase !== 'playing') h += '<button class="act" id="netStart">开始对局</button> ';
    else if (st.hand && st.hand.over) h += '<button class="act" id="netNext">下一局</button> ';
    h += '<button class="act pass" id="netCopyLink">复制邀请链接</button> ';
    h += '<button class="act pass" id="netLeave">离开房间</button> ';
    h += '<button class="act pass" id="netClose3">关闭</button></div>';
    h += '<div style="font-size:12px;color:#9fb3a8;margin-top:8px;line-height:1.7">' +
      '规则和单机完全一样：服务器负责发牌和判定，所有人看到的都是同一副牌。' +
      '谁掉线了电脑先替他打，重连后接着自己打。</div>';
    box.innerHTML = h;
    if ($('netStart')) $('netStart').onclick = function () { netSend({ t: 'start' }); };
    if ($('netNext')) $('netNext').onclick = function () { netSend({ t: 'next' }); };
    $('netCopyLink').onclick = function () {
      var url = location.origin + location.pathname + '?room=' + encodeURIComponent(NET.room);
      var done = function (ok) { netToast(ok ? '邀请链接已复制，发给朋友即可' : '复制被浏览器拒绝，链接是：' + url); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { done(true); }, function () { done(false); });
        else done(false);
      } catch (e) { done(false); }
    };
    $('netLeave').onclick = function () { netLeave(); $('modal').classList.add('hidden'); };
    $('netClose3').onclick = function () { $('modal').classList.add('hidden'); };
  }

  function netOpenBox() {
    $('modalBox').innerHTML = '<h2>联机打牌</h2><div id="netBox"></div>';
  }

  $('btnExport').onclick = showExport;
  $('btnStats').onclick = showStats;
  $('btnDojo').onclick = function () { dojoNew(); };
  $('btnReplay').onclick = showReplayList;

  $('btnLandscape').onclick = requestLandscape;
  $('btnRotateIgnore').onclick = function () {
    rotateDismissed = true;
    try { localStorage.setItem('zmj_noRotate', '1'); } catch (e) {}
    updateRotate();
  };
  $('btnPanel').onclick = function () { sheetOpen(!$('side').classList.contains('open')); };
  $('miniHint').onclick = function () { sheetOpen(!$('side').classList.contains('open')); };
  $('scrim').onclick = function () { sheetOpen(false); };
  if (window.addEventListener) window.addEventListener('resize', function () { updateRotate(); if (game) render(); });
  if (window.addEventListener) window.addEventListener('orientationchange', function () { updateRotate(); if (game) render(); });

  $('btnRules').onclick = showRules;
  $('btnSettings').onclick = showSettings;
  (function initNetButton() {
    var tools = document.querySelector('.tools');
    if (tools) {
      var b = document.createElement('button');
      b.id = 'btnNet'; b.className = 'mini'; b.textContent = '联机';
      b.onclick = showNet;
      tools.insertBefore(b, tools.firstChild);
    }
    try {
      var q = new URLSearchParams(location.search).get('room');
      if (q) { NET.wantRoom = q; setTimeout(showNet, 500); }   // 朋友发来的邀请链接
    } catch (e) {}
  })();
  $('btnNew').onclick = function () { cfg.seed = (Math.random() * 0xffffffff) >>> 0; newGame(); };

  // 启动提示：JS 跑起来就把它收掉；跑不起来它会留在页面正中告诉用户原因
  if ($('boot')) $('boot').classList.add('hidden');
  updateRotate();
  newGame();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
