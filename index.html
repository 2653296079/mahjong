  function btn(label, cls, fn) {
    var b = document.createElement('button');
    b.className = 'act ' + (cls || '');
    b.textContent = label;
    b.onclick = fn;
    return b;
  }
  function act(fn) {
    if (!fn()) return false;
    turnDeadline = 0; pauseStarted = 0;
    if (game.online) return true; // 已在发送时更新等待状态；不能重算旧牌面的讲解。
    render(); timer = setTimeout(tick, 120);
    return true;
  }
  function discardReview(kind, opts, context) {
    if (!opts.length) return null;
    var best = opts[0];
    var picked = opts.filter(function (o) { return o.kind === kind; })[0];
    if (!picked) return null;
    var same = ZMJ.sameEfficiency(picked, best);
    var main = same ? '与牌效推荐一致' :
      (picked.shanten > best.shanten ? '这手增加了 ' + (picked.shanten - best.shanten) + ' 向听' :
        picked.ukeire < best.ukeire ? '比推荐少 ' + (best.ukeire - picked.ukeire) + ' 张进张' : '牌效接近推荐');
    var detail = '你打 ' + ZMJ.tileName(kind) + '；牌效推荐 ' + ZMJ.tileName(best.kind) +
      '（' + best.shanten + ' 向听，进张 ' + best.ukeire + '）';
    if (cfg.analyze) {
      try {
        var sit = context ? null : getSituation();
        var res = context ? context.risk : sit && sit.res;
        if (res) detail += '；该张采样放铳风险约 ' + (res.dealIn(kind).prob * 100).toFixed(1) + '%';
      } catch (e) {}
    }
    return { handNo: context ? context.handNo : game.handNo, main: main, detail: detail, grade: same ? 'good' : 'warn',
      turn: context ? context.turn : game.hand.turnCount, picked: kind, best: best.kind,
      shantenLoss: picked.shanten - best.shanten,
      outsLoss: picked.shanten === best.shanten ? best.ukeire - picked.ukeire : 0 };
  }
  function onDiscardClick(kind, tileId) {
    if (!game.awaiting || game.awaiting.type !== 'turn') return;
    if (game.online && (NET.pendingAction || NET.status !== 'on')) return;
    // 触屏：第一次点选、再点同一张才打出，避免误触
    var key = situationKey();
    if (isTouch && (!selectedTile || selectedTile.id !== tileId || selectedTile.key !== key)) {
      selectedTile = { kind: kind, id: tileId, key: key };
      // 只更新选中牌及操作提示，不重画整桌、不触发分析。
      document.querySelectorAll('.handRow .tile[role="button"]').forEach(function (tile) {
        var chosen = tile.getAttribute('data-tile-id') === tileId;
        tile.classList.toggle('chosen', chosen); tile.setAttribute('aria-pressed', chosen ? 'true' : 'false');
      });
      renderActions();
      showTileAnalysis(kind, tileId, document.querySelector('.handRow [data-tile-id="' + tileId + '"]'), true); return;
    }
    hideTileAnalysis();
    if (game.online) {
      var hand = game.hand, seat = game.humanSeat();
      var context = { handNo: game.handNo, turn: hand.turnCount, risk: sitCache.key === key && sitCache.data ? sitCache.data.res : null };
      var cached = decisionCache && decisionCache.key === key ? decisionCache.report.candidates : null;
      NET.actionTileId = tileId;
      var sent = act(function () { return game.humanDiscard(kind); });
      NET.actionTileId = null;
      if (!sent) return;
      selectedTile = null;
      // 发包优先；复盘只读发送时保存的公开局面，不为点击临时启动风险采样。
      NET.pendingReviews[NET.lastActionId] = discardReview(kind, cached || ZMJ.evaluateDiscards(hand, seat), context);
      return;
    }
    var opts = getDiscardOptions();
    var review = discardReview(kind, opts);
    selectedTile = null;
    if (act(function () { return game.humanDiscard(kind); })) {
      // 联机发出操作不等于操作被接受；过期或连点被拒绝时不能计入成绩。
      if (game.online) NET.pendingReviews[NET.lastActionId] = review;
      else acceptDiscardReview(review);
    }
  }
  function acceptDiscardReview(review) {
    if (!review || !game || review.handNo !== game.handNo) return;
    if (handExtra) {
      handExtra.recTotal++;
      if (review.grade === 'good') handExtra.recFollow++;
      handExtra.reviews.push(review);
    }
    feedback = review; if (!game.online) renderCoach();
  }

  function guidePathsHTML(guide, start) {
    return guide.paths.slice(start || 0).map(function (p) {
      return '<div class="guidePath">摸 ' + ZMJ.tileName(p.draw) + '（未见 ' + p.drawCount + ' 张）→ 打 ' +
        ZMJ.tileName(p.discard) + ' → 听 ' + p.waits.map(function (k, i) { return ZMJ.tileName(k) + '×' + p.waitCounts[i]; }).join('、') +
        '，合计未见 ' + p.waitTotal + ' 张。</div>';
    }).join('');
  }
  function renderHint() {
    var el = $('hint');
    if (!liveHints()) { el.textContent = hiddenHintText(); return; }
    var hs = game.humanSeat();
    if (hs < 0) { el.innerHTML = '<span style="color:#9fb3a8">你在等待区，先看看别人怎么打。</span>'; return; }
    var H = game.hand, p = H.players[hs], a = game.awaiting;
    var rows = [];
    // 胡牌抉择提示
    if (a && a.type === 'claim' && a.options.hu) {
      var outs = game.ukeireFor(hs).total;
      var unknown = ZMJ.visiblePool(H, hs).reduce(function (sum, n) { return sum + n; }, 0);
      rows.push('<b>建议收炮落袋</b>');
      rows.push('现在可以和牌。若放过，下一次自摸的基准命中率为 ' + outs + ' ÷ ' + unknown +
        ' ≈ ' + (ZMJ.drawChance(outs, unknown, 1) * 100).toFixed(1) + '%。');
      rows.push('这是固定听口、未见牌随机分布的模型；对手可能先胡，不能据此推导等待自摸的总收益。');
      rows.push('放过后，直到自己下次摸牌前不能再胡炮。');
      el.innerHTML = rows.join('<br>'); return;
    }
    if (!a || a.type !== 'turn' || a.seat !== hs) {
      var claim = claimAdvice();
      el.textContent = claim ? claim.main + '：' + claim.detail : '摸到牌、轮到你出牌时，这里会按每个弃牌选择重新计算。';
      return;
    }
    var opts = getDiscardOptions();
    var guide = opts.length ? getTrainingGuide(opts[0].kind, true) : null;
    if (!guide) { el.textContent = '当前没有可计算的弃牌。'; return; }
    var stateName = shantenWords(guide.shanten);
    var hitName = guide.shanten === 0 ? '和牌张' : '有效进张';
    rows.push('<div class="guideLead">牌效推荐打 ' + ZMJ.tileName(guide.kind) + ' → ' + stateName + '</div>');
    if (guide.deadWait) rows.push('<div class="guideMath">结构上已经听牌，但和牌张全部可见：未见有效张为 0。需要改良听口。</div>');
    var special = claimAdvice();
    if (special) rows.push('<div class="guideNote">' + netEsc(special.main + '：' + special.detail) + '</div>');
    rows.push('<div class="guideNote">向听是离听牌的牌形距离，0 向听就是已听牌；有效进张是下一摸能降低向听的牌。推荐先比较向听，再比较未见有效张数；放铳风险另列。</div>');
    rows.push('<div class="guideStep">① 打后会等哪些牌？</div>');
    rows.push('<div>共 <b>' + guide.draws.length + '</b> 种' + hitName + '，未见 <b>' + guide.total + '</b> 张：</div>');
    rows.push('<div class="guideTiles">' + (guide.draws.length ? guide.draws.map(function (d) {
      return '<span>' + ZMJ.tileName(d.kind) + ' × ' + d.count + '</span>';
    }).join('') : '<span>当前没有未见有效牌</span>') + '</div>');
    rows.push('<div class="guideMath">下一次自己摸到' + hitName + '的基准概率：' +
      guide.total + ' ÷ ' + guide.unknown + ' 张未见牌 ≈ <b>' +
      (guide.chanceNext * 100).toFixed(1) + '%</b></div>');
    rows.push('<div class="guideStep">② 为什么比其他弃牌好？</div>');
    rows.push('<div class="guideCompare"><b>弃牌</b><b>打后</b><b>未见' + hitName + '</b>');
    opts.slice(0, 3).forEach(function (o) {
      var g = getTrainingGuide(o.kind, true);
      rows.push('<span>' + ZMJ.tileName(o.kind) + (o.kind === guide.kind ? ' ★' : '') +
        '</span><span>' + (g.shanten === 0 ? '听牌' : g.shanten + ' 向听') +
        '</span><span>' + (g.shanten === guide.shanten ? g.total + ' 张' : '不同阶段') +
        (g.averageWait !== null ? '<br><small>进张后平均听 ' + g.averageWait.toFixed(1) + ' 张</small>' : '') + '</span>');
    });
    rows.push('</div>');

      var second = getTrainingGuide(opts[1].kind, false);
      if (second.shanten > guide.shanten) {
        rows.push('<div class="guideNote">例如打 ' + ZMJ.tileName(second.kind) + ' 会退到 ' +
          second.shanten + ' 向听；不同向听阶段的进张数字不能直接比较。</div>');
      } else if (second.total < guide.total) {
        rows.push('<div class="guideNote">同样是 ' + stateName + '，打 ' + ZMJ.tileName(guide.kind) +
          ' 比打 ' + ZMJ.tileName(second.kind) + ' 多 ' + (guide.total - second.total) +
          ' 张未见' + hitName + '。</div>');
      } else {
        rows.push('<div class="guideNote">前两种弃牌的向听和进张相同，均属本轮牌效最优；排列先后不代表谁更安全。还可以比较未来听口和采样风险。</div>');
      }
    }
    rows.push('<div class="guideStep">③ 接下来怎么做牌？</div>');
    if (guide.shanten === 0) {
      rows.push('<div>' + (guide.deadWait ? '结构已听，但目前没有未见和牌张，继续观察可改良的牌。' :

        '</b> 张。连续两次自己的摸牌按此路线和牌，静态基准约 <b>' + (guide.twoDrawWin * 100).toFixed(2) +
        '%</b>；只涵盖先有效进张再和牌的路线。</div>');

    } else {

      '普通牌型按四组面子加一对将，小七对单独计算，取较近的路线。</div>' +
      '<div>本选择：普通牌型 ' + shantenWords(guide.standardShanten) +

      '<div>有效进张是下一摸能降低向听的牌；听牌时则是能直接和牌的牌。每种牌原有四张，减去自己手牌与公开牌，得到“未见张数”。</div>' +

    if(!revealed || revealed.length!==4){box.textContent='本局手牌暂不可用，请刷新至支持结算亮牌的服务器版本。';return;}

    var order=game.humanSeat()<0?[0,1,2,3]:[visSeat(1),visSeat(2),visSeat(3),visSeat(0)];

      var name=document.createElement('h4');name.textContent=game.nameOf(seat)+'（'+who+'） · '+(winner?(result.type==='zimo'?'自摸和牌':'收炮和牌'):shantenWords(sh));card.appendChild(name);

      var concealed=tilesRow(p.concealed,'',null);concealed.classList.add('endConcealed');card.appendChild(concealed);

  function renderReplay() {

    box.innerHTML = '';

    line.textContent = rp.i === 0 ? '开局' : (st.actor >= 0 ? r.names[st.actor] + ' ' + st.desc : st.desc) +
      (st.actor === hs ? '（轮到你）' : '');
    box.appendChild(line);
    // 我的手牌
    var lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:12px;color:#9fb3a8;margin:6px 0 3px';
    lbl.textContent = '你的手牌' + (st.melds[hs].length ? '（副露 ' + st.melds[hs].length + ' 组）' : '') + '：';

      st.melds[hs].forEach(function (m) {
        var d = document.createElement('div'); d.className = 'meld';
        for (var i2 = 0; i2 < (m.type === 'gang' ? 4 : 3); i2++) d.appendChild(tileEl(m.kind, 'meldTile'));

      });

    }

    ob.style.cssText = 'margin-top:10px;font-size:12px;color:#9fb3a8;line-height:1.9';
    [0, 1, 2, 3].forEach(function (s) {
      if (s === hs) return;

      l2.textContent = r.names[s] + '（副露 ' + st.melds[s].length + '）　' +
        (st.discards[s].slice(-14).map(ZMJ.tileName).join(' ') || '—');

  // ---------- 训练统计看板（放铳率为核心指标：调研显示水平提升几乎全部来自少放铳） ----------
  function sparkline(vals) {
    if (!vals.length) return '';
    var w = 260, h = 46, mx = Math.max(20, Math.max.apply(null, vals.map(Math.abs)));
    var bw = Math.max(2, w / vals.length - 1.5);
    var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:46px" preserveAspectRatio="none">';
    out += '<line x1="0" y1="' + (h / 2) + '" x2="' + w + '" y2="' + (h / 2) + '" stroke="rgba(255,255,255,.18)" stroke-width="1"/>';
    vals.forEach(function (v, i) {
      var bh = Math.abs(v) / mx * (h / 2 - 2);
      var x = i * (w / vals.length);
      var y = v >= 0 ? (h / 2 - bh) : (h / 2);
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + (v >= 0 ? '#4cc47c' : '#ff9a8b') + '"/>';
    });
    return out + '</svg>';
  }

  function netSend(obj) {

    if (!NET.ws || NET.ws.readyState !== 1) { netToast('还没连上服务器'); return false; }
    try {
      NET.ws.send(JSON.stringify(obj));
      if (obj.t === 'act') {
        NET.lastActionId = obj.requestId;
        NET.pendingAction = { requestId: obj.requestId, rev: obj.rev, act: obj.act, tileId: NET.actionTileId, at: performance.now(), acknowledged: false };

  // ---------- 代理牌局：形状与单机 game 完全一致，界面代码一行都不用改 ----------
  function makeProxyGame() {
    var P = {
      online: true, seats: [], queue: [], hand: null, awaiting: null, lastResult: null,
      logs: [], handNo: 0, dealer: 0, records: [], fastForward: false, mySeat: -1, lastRecord: null
    };
    P.humanSeat = function () { return P.mySeat; };
    P.nameOf = function (seat) { return (P.seats[seat] && P.seats[seat].name) || ('座位' + ((seat | 0) + 1)); };
    P.aiStep = function () { return false; };            // 电脑由服务器驱动
    P.hasPendingResolve = function () { return false; };
    P.resolvePending = function () { return false; };
    P.startHand = function () { netSend({ t: 'start' }); };
    P.nextHand = function () { netSend({ t: 'next' }); };
    P.humanDiscard = function (kind) { return netSend({ t: 'act', act: 'discard', kind: kind }); };
    P.humanClaim = function (act, kind) { return netSend({ t: 'act', act: act, kind: kind }); };
    P.humanGang = function (kind, type) {
      return netSend({ t: 'act', act: type === 'an' ? 'angang' : 'bugang', kind: kind });
    };
    P.humanZimo = function () { return netSend({ t: 'act', act: 'zimo' }); };
    P.setAiStyle = function () {};
    P.drawsLeft = function () { return P.hand ? Math.floor(P.hand.wall.length / 4) : 0; };
    P.turnOptionsFor = function (seat) {
      var a = P.awaiting;
      if (a && a.type === 'turn' && (seat == null || seat === a.seat)) return a.options;
      return { canZimo: false, anGang: [], buGang: [], tile: null };
    };
    P.evaluateDiscards = function (seat) {
      var s = (seat == null ? P.mySeat : seat);
      if (!P.hand || s < 0) return [];
      try { return ZMJ.evaluateDiscards(P.hand, s); } catch (e) { return []; }
    };
    P.ukeireFor = function (seat) {
      var s = (seat == null ? P.mySeat : seat);
      if (!P.hand || s < 0) return { total: 0, kinds: [] };
      var p = P.hand.players[s];
      try { return ZMJ.ukeire(p.concealed, p.melds.length, ZMJ.visiblePool(P.hand, s)); }
      catch (e) { return { total: 0, kinds: [] }; }
    };
    P.sevenPairsShanten = function () {
      if (!P.hand || P.mySeat < 0) return 99;
      try { return ZMJ.shantenSevenPairs(P.hand.players[P.mySeat].concealed); } catch (e) { return 99; }
    };
    P.exportRecords = function () {
      return { game: '转转麻将（联机）', version: 3, rulesVersion: ZMJ.rulesVersion, analysisVersion: ZMJ.analysisVersion, exportedAt: new Date().toISOString(),
               rules: ZMJ.RULES || null, hands: P.records };
    };
    P.exportText = function () {
      var L = ['转转麻将 · 联机牌谱  ' + new Date().toLocaleString(), '房间 ' + NET.room, ''];
      for (var i = 0; i < P.records.length; i++) {
        var r = P.records[i], res = r.result || {};
        L.push('第 ' + r.no + ' 局：' + (res.title || '') +
          '  收支 ' + (res.deltas || []).join(' / '));
      }
      if (P.records.length === 0) L.push('（本次联机还没有打完一局）');
      return L.join('\n');
    };
    P.applyView = function (v) {
      NET.state = v;
      if(v.archiveError&&!NET.archiveError)netToast('联机存档暂时写入失败，服务器正在重试，请保留本局牌谱');
      NET.archiveError=!!v.archiveError;accountSyncLabel();
      P.mySeat = (v.you && typeof v.you.seat === 'number') ? v.you.seat : -1;
      var rs = (v.room && v.room.seats) ? v.room.seats : [];
      P.seats = [];
      for (var i = 0; i < 4; i++) {
        var s = rs[i];
        // 还没开局时服务器不发座位，这里必须给占位对象：界面会直接读 seats[i].isHuman
        P.seats.push(s ? { name: s.name, score: s.score, isHuman: !!s.isHuman, online: !!s.online,
                           zimoCount: s.zimoCount, paoCount: s.paoCount,
                           handsWon: s.handsWon, handsPlayed: s.handsPlayed }
                       : { name: '空位', score: 0, isHuman: false, online: true,
                           zimoCount: 0, paoCount: 0, handsWon: 0, handsPlayed: 0 });
      }
      P.queue = [];
      var q = (v.room && v.room.queue) ? v.room.queue : [];
      for (var j = 0; j < q.length; j++) P.queue.push({ name: q[j].name, isHuman: !!q[j].isHuman });
      var previousHandNo = P.handNo;
      P.handNo = v.room ? v.room.handNo : 0;
      if (P.handNo !== previousHandNo) {
        resetHandExtra(); feedback = null;
        if ($('btnNext')) $('btnNext').textContent = '返回当前牌局';
      }
      if (!v.hand) { P.hand = null; P.awaiting = null; P.lastResult = null; return; }
      var h = v.hand;
      P.dealer = h.dealer;
      P.awaiting = h.awaiting
        ? { type: h.awaiting.type, seat: P.mySeat, options: h.awaiting.options, tile: h.awaiting.tile }
        : null;
      var players = [];
      for (var s2 = 0; s2 < 4; s2++) {
        var pub = h.players[s2] || {};
        var mineHere = h.mine && h.mine.seat === s2;
        var cons = [];
        for (var k = 0; k < ZMJ.KINDS; k++) cons.push(mineHere ? (h.mine.concealed[k] || 0) : 0);
        players.push({
          concealed: cons,
          concealedCount: pub.concealedCount,                 // 界面画对手的牌背时用这个
          melds: (pub.melds || []).slice(),
          discards: (pub.discards || []).slice(),
          passedWin: !!pub.passedWin
        });
      }
      P.hand = {
        players: players,
        wall: { length: h.wallLeft },                          // 牌墙只给张数，顺序不出服务器
        turn: h.turn, lastDraw: h.lastDraw, lastDiscard: h.lastDiscard,
        turnCount: h.turnCount, over: !!h.over,
        river: Array.isArray(h.river)?h.river:null,
        result: v.result || null,
        revealed: h.over && Array.isArray(h.revealed)?h.revealed:null,
        birds: (v.result && v.result.birds) ? v.result.birds : []
      };
      P.lastResult = v.result || null;
      P.logs = (v.logs || []).slice();
      if (v.record) {
        var last = P.records.length ? P.records[P.records.length - 1] : null;
        if (!last || last.no !== v.record.no) P.records.push(v.record);
        P.lastRecord = v.record;
      }
    };
    return P;
  }

  function onNetMessage(m) {
    if (!m || !m.t) return;
    if (m.t==='welcome') {
      if(m.instance&&NET.instance&&m.instance!==NET.instance&&NET.room){NET.room='';NET.token='';NET.state=null;proxyGame=null;if(game&&game.online){game=null;showHome();}try{sessionStorage.removeItem('zmj_seat_v1');}catch(e){}netToast('联机服务已恢复，原对局已中断，请重新进入房间。');}
      NET.instance=m.instance||NET.instance;NET.identity=m.identity||NET.identity;NET.name=identityName();NET.presence=readPresence(m.presence);NET.lobby=m.rooms||[];NET.replaced=false;
      if(NET.room)netJoin(NET.room,NET.name,NET.token);else netSend({t:'rooms'});netBar();if($('netBox'))renderNet();return;
    }
    if(m.t==='presence'){var people=readPresence(m);if(!people)return;var changed=JSON.stringify(NET.lobby)!==JSON.stringify(m.rooms||[]);NET.presence=people;NET.lobby=m.rooms||[];netBar();if(changed&&$('netBox'))renderNet();else updateOnlineLabels();return;}
    if (m.t === 'rooms') { NET.lobby = m.rooms || null; if ($('netBox')) renderNet(); return; }
    if (m.t === 'joined') {
      NET.room = m.room; NET.token = m.token; NET.pid = m.pid;
      if (m.you) NET.name = m.you;
      netSaveCfg();
      try { sessionStorage.setItem('zmj_seat_v1', JSON.stringify({ room: NET.room, token: NET.token, server: NET.server })); } catch (e) {}
      netToast('进入房间 ' + m.room);
      netBar();
      if ($('netBox')) renderNet();
      return;
    }
    if (m.t === 'replaced') {
      NET.replaced=true;clearTimeout(NET.retryTimer);
      NET.room = ''; NET.token = ''; NET.status = 'error'; NET.err = m.msg;
      NET.state = null; proxyGame = null;
      if (game && game.online) { game = null; clearTimeout(timer); }
      try { sessionStorage.removeItem('zmj_seat_v1'); } catch (e) {}
      netBar(); closeModal(); showHome(); netToast(m.msg); return;
    }
    if (m.t === 'left') { NET.room = ''; NET.state = null; netBar(); if ($('netBox')) renderNet(); return; }
    if (m.t === 'err') {
      if(m.code==='auth'){NET.authError=true;if(NET.ws)NET.ws.close(1008,'login required');}
      if (m.requestId) delete NET.pendingReviews[m.requestId];
      if (NET.pendingAction && m.requestId === NET.pendingAction.requestId) { clearPendingAction(); if (game && game.online) render(); }
      netToast(m.msg); NET.err = m.msg; if ($('netBox')) renderNet(); return;
    }
    if (m.t === 'ack') {
      if (NET.pendingAction && NET.pendingAction.requestId === m.requestId) {
        NET.lastConfirm = Math.round(performance.now() - NET.pendingAction.at);
        NET.serverMs = Number.isFinite(m.serverMs) ? m.serverMs : null;
        NET.pendingAction.acknowledged = true; netDiagnostics();
      }
      var accepted = NET.pendingReviews[m.requestId]; delete NET.pendingReviews[m.requestId];
      if (accepted) acceptDiscardReview(accepted);
      return;
    }
    if (m.t === 'pong') {
      if (NET.probe && m.probe === NET.probe.id) { NET.roundTrip = Math.round(performance.now() - NET.probe.at); NET.probe = null; netDiagnostics(); }
      else if (NET.probe && m.probe == null) { NET.probeUnsupported = true; NET.probe = null; netDiagnostics(); }
      return;
    }
    if (m.t === 'chat') { netToast(m.from + '：' + m.text); return; }
    if (m.t === 'state') {
      if (NET.pendingAction && NET.pendingAction.acknowledged && m.rev > NET.pendingAction.rev) clearPendingAction();
      var P = netUseProxy();
      P.applyView(m);
      netBar();
      tick();
      if ($('netBox')) renderNet();
      return;
    }
  }

        '<div class="homeArt" aria-hidden="true">' + tileEl(3, 'big').outerHTML + tileEl(13, 'big').outerHTML + tileEl(19, 'big').outerHTML + '<span class="homeArtCaption">万 · 条 · 筒</span></div></div>' +
        '<div class="homeCards">' +
          '<button class="homeCard homePractice" id="homePractice">' +
            '<span class="homeCardTop"><span class="homeIndex">01 / 每日一练</span><span class="homeCardIcon" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="6" y="3" width="16" height="22" rx="3"/><path d="M11 9h6m-6 5h6m-6 5h3"/></svg></span></span>' +
            '<span class="homeTag">牌效训练</span><span class="homeDesc">先自己选一张，再看向听、进张和做牌路线。错过的好牌，留到下次练明白。</span>' +
            '<span class="homeGo">从一道题开始</span></button>' +
          '<button class="homeCard" id="homeSolo">' +
            '<span class="homeCardTop"><span class="homeIndex">02 / 从容上桌</span><span class="homeCardIcon" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="4" y="4" width="20" height="20" rx="5"/><path d="M10 10h8v8h-8zm4-6v3m0 14v3M4 14h3m14 0h3"/></svg></span></span>' +
            '<span class="homeTag">单机练习</span>' +
            '<span class="homeDesc">和三位电脑练一局。边打边看讲解，或先独立判断，结束后回看每次选择。</span>' +
            '<span class="homeGo">开始练习</span>' +
          '</button>' +
          '<button class="homeCard" id="homeOnline">' +
            '<span class="homeCardTop"><span class="homeIndex">03 / 好友同桌</span><span class="homeCardIcon" aria-hidden="true"><svg viewBox="0 0 28 28"><circle cx="10" cy="9" r="4"/><path d="M3 24v-3a7 7 0 0 1 14 0v3m1-19a4 4 0 0 1 0 8m3 3a6 6 0 0 1 4 6v2"/></svg></span></span>' +
            '<span class="homeTag">联机打牌</span>' +
            '<span class="homeDesc">自动连接大厅，邀朋友同桌。账号显示注册名，未登录也可作为访客加入。</span>' +
            '<span class="homeOnlineStatus" id="homeOnlineCount">进入大厅自动连接</span>'+
            '<span class="homeGo">进入房间</span>' +
          '</button>' +
        '</div>' +
        '<div class="homeBottom"><div><div class="homeStatLabel">我的练习足迹</div><div class="homeStat">' + stat + '</div></div>' +
        '<div class="homeRule">108 张 · 万 / 条 / 筒 · 无字牌<br>不能吃，可碰可杠 · 小七对与平胡同价<br>收炮 5+鸟钱，自摸每家 10+鸟钱<br><span id="buildVersion">版本 ' + BUILD + '</span></div></div>' +
      '</div>';
    el.classList.remove('hidden');
    syncLayers();
    $('homePractice').onclick = function () { hideHome(); startPractice(); };
    if (game && !game.online && game.hand && !game.hand.over) $('homeSolo').querySelector('.homeGo').textContent = '继续本局';
    clearTimeout(timer);                      // 菜单期间不推进牌局
    $('homeAccount').onclick = showAccount; accountLabels();
    updateOnlineLabels();
    refreshLobbyCount();
    $('homeSolo').onclick = function () {
      hideHome();
      if (game && game.online) netLeave(true);  // 从联机切回单机
      if (game && !game.online && game.hand && !game.hand.over) { render(); timer = setTimeout(tick, 200); return; }
      newGame();
    };
    $('homeOnline').onclick = function () { hideHome(); showNet(); };
  }
  function hideHome() { var el = $('home'); if (el) el.classList.add('hidden'); syncLayers(); }

  $('btnExport').onclick = showExport;
  $('riverSource').onchange=function(){cfg.discardSource=this.checked;saveConfig();renderRiver();};
  $('btnAccount').onclick = showAccount;
  $('btnStats').onclick = showStats;
  $('btnPractice').onclick = startPractice;
  $('btnDojo').onclick = function () { dojoNew(); };
  $('btnReplay').onclick = showReplayList;

  $('btnLandscape').onclick = requestLandscape;
  $('btnRotateIgnore').onclick = function () {
    rotateDismissed = true;
    try { localStorage.setItem('zmj_noRotate', '1'); } catch (e) {}
    updateRotate();
  };
  $('btnPanel').onclick = function () { sheetOpen(!$('side').classList.contains('open')); };
  $('miniHint').onclick = function () { sheetOpen(!$('side').classList.contains('open')); };
  $('scrim').onclick = function () { sheetOpen(false); };
  if (window.addEventListener) window.addEventListener('resize', function () { updateRotate(); if (game) render(); });
  if (window.addEventListener) window.addEventListener('orientationchange', function () { updateRotate(); if (game) render(); });

  $('btnRules').onclick = showRules;
  $('btnSettings').onclick = showSettings;
  $('btnTileArt').onclick = showTileArt;
  $('moreTools').addEventListener('click', function (e) { if (e.target.closest('button')) this.open = false; });
  document.addEventListener('click', function (e) { if (!$('moreTools').contains(e.target)) $('moreTools').open = false; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('moreTools').open) { $('moreTools').open = false; $('moreTools').querySelector('summary').focus(); } });
  (function initNetButton() {
    var tools = document.querySelector('.tools');
    if (tools) {
      var b = document.createElement('button');
      b.id = 'btnNet'; b.className = 'mini'; b.textContent = '联机';
      b.onclick = showNet;
      tools.insertBefore(b, tools.firstChild);
      var hb = document.createElement('button');
      hb.id = 'btnHome'; hb.className = 'mini'; hb.textContent = '主界面';
      hb.onclick = function () {
        if (game && game.online && !window.confirm('正在联机，回主界面会离开房间。确定吗？')) return;
        if (game && game.online) { netLeave(); closeModal(); return; }
        showHome();
      };
      tools.insertBefore(hb, b.nextSibling);
    }
    try {
      var inviteParams = new URLSearchParams(location.search);
      var q = inviteParams.get('room');
      if (q && inviteParams.get('server')) {
        NET.explicitServer=true;
        var inviteServer = inviteParams.get('server');
        if (NET.server !== inviteServer || NET.room && NET.room !== q) { NET.room = ''; NET.token = ''; }
        NET.server = inviteServer;
      }
      if (q && NET.room && NET.room !== q) { NET.room = ''; NET.token = ''; }
      // 朋友发来的邀请链接：跳过主界面，直接进联机面板
      if (q||inviteParams.get('online')==='1') { NET.wantRoom = q||''; setTimeout(function () { hideHome(); showNet(); }, 400); }
    } catch (e) {}
  })();
  $('btnNew').onclick = function () { cfg.seed = (Math.random() * 0xffffffff) >>> 0; newGame(); };

  // 启动提示：JS 跑起来就把它收掉；跑不起来它会留在页面正中告诉用户原因
  if ($('boot')) $('boot').classList.add('hidden');
  updateRotate();
  showHome();          // 先出主界面，由用户选单机还是联机
  accountReady = refreshAccount();
  accountReady.then(refreshLobbyCount);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
