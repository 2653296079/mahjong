  // ---------- 主循环 ----------
  function tick() {
    clearTimeout(timer);
    if (!game) return;
    if((table3D.busy||game.hand&&game.hand.dicePending)&&!game.online){if(!pauseStarted)pauseStarted=Date.now();timer=setTimeout(tick,150);return;}
    if (!game.online && (($('home') && !$('home').classList.contains('hidden')) || !$('modal').classList.contains('hidden'))) { if (!pauseStarted) pauseStarted = Date.now(); timer = setTimeout(tick, 250); return; }
    if (game.online) {
      // 联机：牌局在服务器上跑，这里只把收到的状态画出来
      var Hnet = game.hand;
      if (!Hnet) return;
      if (Hnet.over) {
        lastAwaiting = null; pauseStarted = 0; turnDeadline = 0;
        if (settledHandNo !== game.handNo) { recordHandStats(); settledHandNo=game.handNo; render(); showSettlement(); }
        return;
      }
      lastAwaiting = game.awaiting;
      turnDeadline = 0;
      render();
      return;
    }
    if (!(game.awaiting && game.awaiting.type === 'turn')) selectedTile = null;
    var H = game.hand;
    if (H.over) {
      lastAwaiting = null; pauseStarted = 0;
      turnDeadline = 0;
      if (settledHandNo !== game.handNo) { recordHandStats(); settledHandNo=game.handNo; render(); showSettlement(); }
      return;
    }
    // 人不在桌上：快进（忽略所有计时）
    if (game.humanSeat() < 0) {
      lastAwaiting = null;
      game.fastForward = true;
      render();
      var guard = 0;
      while (guard++ < 8000) {
        if (game.humanSeat() >= 0) break;
        if (game.hand.over) break;
        if (game.hasPendingResolve && game.hasPendingResolve()) { game.resolvePending(); continue; }
        if (!game.aiStep()) break;
      }
      game.fastForward = false;
      render();
      timer = setTimeout(tick, 60);
      return;
    }
    // AI 的碰/杠/胡抉择：等 aiThink 秒
    if (game.hasPendingResolve && game.hasPendingResolve()) {
      turnDeadline = 0; lastAwaiting = null;
      render();
      timer = setTimeout(function () { if (!$('modal').classList.contains('hidden') || ($('home') && !$('home').classList.contains('hidden'))) { tick(); return; } game.resolvePending(); tick(); }, Math.max(0.2, cfg.aiThink) * 1000);
      return;
    }
    // 练习默认不限时；限时模式在弹窗、抽屉或切到后台时暂停。
    if (game.awaiting) {
      var now = Date.now();
      var paused = !$('modal').classList.contains('hidden') || $('side').classList.contains('open') || document.hidden;
      if (paused) {
        if (!pauseStarted) pauseStarted = now;
        renderTimer();
        timer = setTimeout(tick, 250);
        return;
      }
      if (pauseStarted) { if (turnDeadline) turnDeadline += now - pauseStarted; pauseStarted = 0; }
      if (lastAwaiting !== game.awaiting) {
        if (game.awaiting.type === 'turn') feedback = null;
        lastAwaiting = game.awaiting;
        turnDeadline = cfg.turnTime ? now + cfg.turnTime * 1000 : 0;
        render();
      }
      if (!cfg.turnTime) return;
      var left = turnDeadline - Date.now();
      if (left <= 0) { turnDeadline = 0; autoAct(); return; }
      renderTimer();
      timer = setTimeout(tick, Math.min(250, left + 20));
      return;
    }
    // 电脑行动：等 aiThink 秒（有性格时按 paceMul 微调节奏，clamp 0.4–2.0 秒）
    turnDeadline = 0; lastAwaiting = null;
    render();
    var paceWait = Math.max(0.2, cfg.aiThink) * 1000;
    var paceSeat = game.hand ? game.hand.turn : null;
    if (paceSeat != null && game.seats[paceSeat]) {
      var pacePp = ZMJ.personaParams(game.seats[paceSeat].persona);
      if (pacePp) paceWait = Math.min(2000, Math.max(400, paceWait * pacePp.paceMul));
    }
    timer = setTimeout(function () {
      if (!game || game.hand.over || !$('modal').classList.contains('hidden') || ($('home') && !$('home').classList.contains('hidden'))) { tick(); return; }
      game.aiStep();
      tick();
    }, paceWait);
  }

  // 超时自动操作
  function autoAct() {
    accountAutoAct=true;
    try {
    var a = game.awaiting;
    if (!a) { tick(); return; }
    if (a.type === 'turn' && drawPending2D()) acceptDrawnTile();
    if (a.type === 'turn') {
      if (a.options.canZimo) { act(function () { return game.humanZimo(); }); return; }
      if (a.options.anGang.length) { act(function () { return game.humanGang(a.options.anGang[0], 'an'); }); return; }
      if (a.options.buGang.length) { act(function () { return game.humanGang(a.options.buGang[0], 'bu'); }); return; }
      var opts = game.evaluateDiscards(a.seat);
      if (opts.length) act(function () { return game.humanDiscard(opts[0].kind); });
      return;
    }
    if (a.type === 'claim') {
      act(function () { return game.humanClaim(a.options.hu ? 'hu' : 'pass'); });
    }
    } finally { accountAutoAct=false; }
  }

  function renderSituation() {
    if (!liveHints()) { $('situation').textContent = hiddenHintText(); return; }
    var el = $('situation');
    if (!el) return;
    var hs = game.humanSeat();
    if (hs < 0) { el.innerHTML = '<span style="color:#9fb3a8">你在等待区，先看别人打。</span>'; return; }
    if (!cfg.analyze) { el.innerHTML = '<span style="color:#9fb3a8">已在设置里关闭</span>'; return; }
    if (drawPending2D()) { el.innerHTML = '<span style="color:#9fb3a8">先从牌墙摸牌，摸入张翻开后再计算。</span>'; return; }
    var H = game.hand, a = game.awaiting;
    var myTurn = !!(a && a.type === 'turn' && a.seat === hs);
    var sit = getSituation();
    if (!sit) {
      el.textContent = game.online && a && a.seat === hs ? (riskWorkerError || (NET.pendingAction ? '操作确认后再更新风险估计。' : '正在后台采样；可以先按基础牌效判断。')) : '';

        var retry = btn('重试后台分析', 'pass', function () { stopRiskWorker(); riskWorkerError = ''; renderSituation(); });
        retry.id = 'retryRiskWorker'; el.appendChild(retry);
      }
      return;
    }
    var res = sit.data ? sit.data : sit;
    var r = sit.res || res;
    var cands = sit.cands;
    var out = [];
    out.push('<div class="sitHead">全桌第 ' + H.turnCount + ' 摸 · 牌墙 ' + H.wall.length + ' 张 · 分析 ' + ((sit.ms != null ? sit.ms : r.ms) || 0) + 'ms / ' + cfg.worlds + ' 组采样</div>');
    out.push('<details class="practiceNote"><summary>这些百分比怎样理解？</summary>这是采样模型的估计，不是已知的对手手牌。当前模型在固定模拟评估中有高估现象，尚未完成真实玩家校准；更多采样只能减小随机波动，不能消除先验偏差。请结合公开牌与基础牌效判断。</details>');
    // 对手威胁
    out.push('<div class="sitSec">对手威胁（推断）</div>');
    r.opponents.forEach(function (o) {
      var nm = netEsc(game.nameOf(o.seat));
      out.push('<div class="opp"><span class="nm">' + nm + '</span>' +
        '<span class="bar"><i style="width:' + Math.round(o.tenpaiProb * 100) + '%;background:' + barColor(o.tenpaiProb) + '"></i></span>' +
        '<span class="pc ' + riskCls(o.tenpaiProb) + '">' + Math.round(o.tenpaiProb * 100) + '%</span></div>');
      if (o.waits.length) {
        out.push('<div class="waits">听：' + o.waits.slice(0, 4).map(function (x) { return ZMJ.tileName(x.kind) + ' ' + Math.round(x.prob * 100) + '%'; }).join('、') + '</div>');
      }
    });
    // 打牌风险
    if (myTurn && cands.length) {
      var maxP = 0;
      cands.forEach(function (c) { if (c.prob > maxP) maxP = c.prob; });
      out.push('<div class="sitSec">候选弃牌的采样风险估计</div>');
      if (maxP < 0.005) {
        out.push('<div style="color:#7ee2a8;font-size:12.5px">采样暂未发现明显听牌迹象。上方「出牌讲解」列出了牌效推荐、有效牌和计算依据。</div>');
      } else {
      out.push('<table class="sit">');
      cands.forEach(function (c, i) {
        var kill = c.killers.length ? '<span class="kill">' + c.killers.map(function (k) { return netEsc(game.nameOf(k.seat)) + Math.round(k.prob * 100) + '%'; }).join(' ') + '</span>' : '';
        out.push('<tr class="' + (i === 0 ? 'rec' : '') + '"><td>' + ZMJ.tileName(c.kind) + '</td>' +
          '<td style="color:#9fb3a8">向' + c.shanten + '</td>' +
          '<td style="color:#9fb3a8">进' + c.ukeire + '</td>' +
          '<td class="' + riskCls(c.prob) + '" style="text-align:right">' + (c.prob * 100).toFixed(1) + '%</td>' +
          '<td>' + kill + '</td></tr>');
      });
      out.push('</table>');
      }
      // 建议：进张价值 vs 放铳风险
      var best = null;
      cands.forEach(function (c) {
        var score = c.ukeire - c.prob * 160;   // 放铳 1% ≈ 牺牲 1.6 张进张（按 12.7 元 vs 进张价值估算）
        if (!best || score > best.score) { best = { c: c, score: score }; }
      });
      var safest = cands.slice().sort(function (x, y) { return x.prob - y.prob; })[0];
      out.push('<div class="advice">风险折中参考：打 <b>' + ZMJ.tileName(best.c.kind) + '</b>（进张 ' + best.c.ukeire + '，采样放铳 ' + (best.c.prob * 100).toFixed(1) + '%）');
      if (safest.kind !== best.c.kind && safest.prob + 0.02 < best.c.prob) {
        out.push('<br>想稳一点可以打 <b>' + ZMJ.tileName(safest.kind) + '</b>（放铳仅 ' + (safest.prob * 100).toFixed(1) + '%，但进张 ' + safest.ukeire + '）');
      }
      out.push('<br><small>此处是启发式权衡，采样概率有误差；纯牌效推导见上方。</small></div>');
    } else if (!myTurn) {
      out.push('<div class="sitHead" style="margin-top:6px">（非我回合，显示的是最新推断）</div>');
    }
    el.innerHTML = out.join('');
  }

  // ---------- 程序化牌友头像：Canvas 参数绘制，零图片（国风线描 + 朱砂印） ----------
  var AVATAR_ACCENTS = ['#3f6b52', '#a8452f', '#8a6417', '#35566b', '#7d5a78', '#2f3230'];
  var AVATAR_INK = '#24332c';
  var AVATAR_PAPER = '#f6efdf';
  var AVATAR_CACHE = {}, AVATAR_DEBUG = { draws: 0, skips: 0, failures: 0 };
  function avatarHash(text) {
    var s = String(text == null ? '' : text).slice(0, 24), h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  // 七组参数各自加盐：同一名字永久同一张脸，性格/座位不影响
  function avatarParams(name, isMe) {
    var base = String(name == null ? '' : name);
    var face = avatarHash(base + '#face') % 3;
    var hair = avatarHash(base + '#hair') % 6;
    var beard = avatarHash(base + '#beard') % 4;
    var glasses = avatarHash(base + '#glasses') % 3;
    var hat = avatarHash(base + '#hat') % 5;
    var accent = avatarHash(base + '#accent') % 6;
    if (hair === 3) beard = 0;
    var stamp = '闲';
    if (isMe) stamp = '我';
    else {
      var chars = base.replace(/\s+/g, '');
      if (chars) stamp = chars.slice(0, 1);
    }
    return { face: face, hair: hair, beard: beard, glasses: glasses, hat: hat, accent: accent, stamp: stamp };
  }
  function avatarKey(name, isMe, px) { return String(name == null ? '' : name) + '|' + (isMe ? 'me' : 'ai') + '|' + px; }
  function avatarPx(cssPx) {
    var dpr = 1;
    try { dpr = window.devicePixelRatio || 1; } catch (e) {}
    return Math.max(64, Math.min(128, Math.round((cssPx || 30) * Math.max(1, Math.min(2, dpr)))));
  }
  function avatarCssPx() {
    var w = 1024, h = 768, is3d = false;
    try { w = window.innerWidth || w; h = window.innerHeight || h; } catch (e) {}
    try { is3d = document.body.classList.contains('table3d'); } catch (e) {}
    if (is3d) return w <= 680 ? 18 : 26;
    if (h <= 500) return 16;
    if (w <= 680) return 16;
    if (w <= 820) return 22;
    if (w <= 920) return 26;
    if (w <= 1120) return 28;
    return 30;
  }
  function avatarRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  // 只画，不读牌局；参数全部来自 avatarParams
  function drawAvatar(canvas, p, cssPx) {
    var ctx = null;
    try { ctx = canvas.getContext('2d'); } catch (e) { ctx = null; }
    if (!ctx || !p) return false;
    var px = avatarPx(cssPx);
    var size = cssPx || 30;
    var simple = size < 24;
    canvas.width = px; canvas.height = px;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, px, px);
    ctx.scale(px / 64, px / 64);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.imageSmoothingEnabled = true;
    var accent = AVATAR_ACCENTS[p.accent] || AVATAR_ACCENTS[0];
    // L0 象牙纸 + 金线外框
    avatarRoundRect(ctx, 0.6, 0.6, 62.8, 62.8, 14);
    ctx.fillStyle = AVATAR_PAPER; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(201,176,106,.55)'; ctx.stroke();
    // L1 月洞（主色半圆）
    if (!simple) {
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(32, 30, 26, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    // L2 交领
    ctx.beginPath();
    ctx.moveTo(12, 64); ctx.lineTo(24, 46); ctx.lineTo(40, 46); ctx.lineTo(52, 64); ctx.closePath();
    ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = accent; ctx.fill(); ctx.restore();
    ctx.lineWidth = 1.15; ctx.strokeStyle = AVATAR_INK; ctx.stroke();

    ctx.fillStyle = '#efe6d2'; ctx.fillRect(28, 46, 8, 9);
    // L4 脸
    ctx.fillStyle = '#f7f1e2'; ctx.lineWidth = 1.15; ctx.strokeStyle = AVATAR_INK;
    if (p.face === 1) {
      ctx.beginPath(); ctx.ellipse(32, 30, 10, 13, 0, 0, Math.PI * 2);
    } else if (p.face === 2) {
      ctx.beginPath();
      ctx.moveTo(22, 17); ctx.lineTo(42, 17); ctx.lineTo(43, 32);
      ctx.lineTo(39, 42); ctx.lineTo(25, 42); ctx.lineTo(21, 32); ctx.closePath();

      avatarRoundRect(ctx, 21, 17, 22, 25, 9);
    }
    ctx.fill(); ctx.stroke();
    // L5 发
    ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = '#2b2b2b';
    if (p.hair === 0) {
      ctx.beginPath(); ctx.arc(32, 20, 12, Math.PI, 0); ctx.closePath(); ctx.fill();

    } else if (p.hair === 1) {
      avatarRoundRect(ctx, 20, 13, 24, 9, 4); ctx.fill();
    } else if (p.hair === 2) {
      ctx.beginPath(); ctx.arc(32, 21, 13, Math.PI, 0);
      ctx.lineTo(40, 22); ctx.lineTo(32, 17); ctx.lineTo(24, 22); ctx.closePath(); ctx.fill();
    } else if (p.hair === 3) {
      ctx.beginPath(); ctx.arc(32, 21, 13, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.ellipse(47, 40, 3.2, 7, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(49, 52, 3, 7.5, 0.15, 0, Math.PI * 2); ctx.fill();
    } else if (p.hair === 4) {
      ctx.beginPath(); ctx.arc(32, 23, 12, Math.PI * 1.05, -0.05); ctx.closePath(); ctx.fill();

    }
    ctx.restore();
    // L6 五官
    ctx.strokeStyle = AVATAR_INK; ctx.lineWidth = 1.05;
    ctx.beginPath(); ctx.moveTo(25, 25); ctx.lineTo(29, 24.4); ctx.moveTo(35, 24.4); ctx.lineTo(39, 25); ctx.stroke();
    ctx.fillStyle = AVATAR_INK;
    ctx.beginPath(); ctx.arc(27, 29, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(37, 29, 1.4, 0, Math.PI * 2); ctx.fill();
    if (!simple) {
      ctx.beginPath(); ctx.moveTo(32, 30); ctx.lineTo(31, 34); ctx.lineTo(33.2, 34.4); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(32, 35.4, 2.6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    // L7 须
    if (p.beard === 1) {
      ctx.beginPath(); ctx.moveTo(28, 36.5); ctx.lineTo(23.5, 38.8);
      ctx.moveTo(36, 36.5); ctx.lineTo(40.5, 38.8); ctx.stroke();
    } else if (p.beard === 2) {
      ctx.beginPath(); ctx.moveTo(32, 38); ctx.lineTo(32, 45); ctx.stroke();
      ctx.save(); ctx.globalAlpha = 0.15; ctx.fillStyle = AVATAR_INK;
      ctx.beginPath(); ctx.ellipse(32, 43, 3.4, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    } else if (p.beard === 3) {
      ctx.save(); ctx.globalAlpha = 0.15; ctx.fillStyle = AVATAR_INK;
      ctx.beginPath(); ctx.arc(32, 31, 13, 0.15 * Math.PI, 0.85 * Math.PI); ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.arc(32, 31, 13, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    }
    // L8 眼镜
    if (p.glasses === 1) {
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(27, 29, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(37, 29, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(31, 29); ctx.lineTo(33, 29); ctx.stroke();
    } else if (p.glasses === 2) {
      ctx.lineWidth = 1.2;
      ctx.strokeRect(22.5, 25.5, 9, 7); ctx.strokeRect(32.5, 25.5, 9, 7);
      ctx.beginPath(); ctx.moveTo(31.5, 29); ctx.lineTo(32.5, 29); ctx.stroke();
    }
    // L9 头饰
    if (p.hat === 1) {
      ctx.save(); ctx.globalAlpha = 0.2; ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(32, 20, 11, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.arc(32, 20, 11, Math.PI, 0); ctx.stroke();

  // 练习计时器
  function renderTimer() {
    var el = $('turnTimer');
    if (!el) return;
    if(table3D.busy){el.className='';el.textContent='开局演出中';return;}
    var H = game.hand, a = game.awaiting;
    if (H.over) { el.className = 'hidden'; return; }
    if (a && a.seat === game.humanSeat()) {
      var label = a.type === 'claim' ? '要不要碰 / 杠 / 胡？' : (drawPending2D() ? '请从牌墙摸牌' : '请出牌');
      if (!cfg.turnTime) {
        el.className = '';
        el.textContent = label + ' · 不限时';
        return;
      }
      var total = cfg.turnTime * 1000;
      var left = turnDeadline ? Math.max(0, turnDeadline - Date.now()) : total;
      if (pauseStarted) left = turnDeadline ? Math.max(0, turnDeadline - pauseStarted) : total;
      var sec = Math.ceil(left / 1000);
      var pct = Math.round(left / total * 100);
      el.className = sec <= 8 ? 'warn' : '';
      el.innerHTML = '<span>' + label + (pauseStarted ? ' · 已暂停' : '') + '</span>' +
        '<span class="tbar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="sec">' + sec + 's</span>';
      return;
    }
    if (game.humanSeat() >= 0) {
      el.className = 'ai';
      el.innerHTML = '<span>' + netEsc(game.nameOf(H.turn)) + (game.hasPendingResolve && game.hasPendingResolve() ? ' 考虑要不要碰…' : ' 思考中…') + '</span>';
      return;
    }
    el.className = 'hidden';
  }

  // 碰 / 杠 / 胡 / 自摸 的推荐：只用公开信息推算，和出牌推荐同一套口径
  function shantenWords(s) { return s < 0 ? '已和牌' : s === 0 ? '已听牌' : (s + ' 向听'); }
  function kongWords(kind, type, from) {
    var k = ZMJ.kongAdvice(game.hand, game.humanSeat(), kind, type, from);
    if (!k) return { main: '先比较弃牌', detail: '当前没有可分析的补摸牌。', cls: '' };
    return { main: '可' + (type === 'an' ? '暗杠 ' : type === 'bu' ? '补杠 ' : '明杠 ') + ZMJ.tileName(kind),
      detail: '即时杠分 +' + k.gain + ' 元；不杠可保留 ' + shantenWords(k.beforeShanten) +
        '。随机补摸后，有 ' + (k.keepChance * 100).toFixed(1) + '% 可保持该距离或更近。' +
        (k.losesSevenPairs ? '杠牌将放弃小七对路线。' : '') +
        '这是牌形基准，未计对手提前胡牌与弃牌风险；可继续比较打牌。', cls: '' };
  }
  function claimAdvice() {
    var a = game.awaiting;
    if (!a || !game.hand) return null;
    var H = game.hand, seat = a.seat, p = H.players[seat];
    if (!p) return null;
    if (a.type === 'turn') {
      var o = a.options || {};
      if (o.canZimo) {
        return { main: '自摸胡！', detail: '三家各付 基础 10 元 + 鸟钱，直接收下', cls: 'good' };
      }
      if (o.anGang && o.anGang.length) {
        return kongWords(o.anGang[0], 'an');
      }
      if (o.buGang && o.buGang.length) {
        return kongWords(o.buGang[0], 'bu');
      }
      return null;   // 没有特殊动作，交给原来的弃牌推荐
    }
    if (a.type !== 'claim') return null;
    var c = a.options || {};
    if (c.hu) {
      return { main: '胡 ' + ZMJ.tileName(c.kind),
               detail: game.nameOf(c.from) + ' 放炮，他一个人付 基础 5 元 + 鸟钱', cls: 'good' };
    }
    if (c.gang) {
      return kongWords(c.kind, 'ming', c.from);
    }
    if (c.peng) {
      var advice = ZMJ.pengAdvice(H, seat, c.kind, c.from);
      if (!advice) return null;
      return { main: (advice.better ? '建议碰 ' : '建议过 ') + ZMJ.tileName(c.kind),
        detail: '不碰：' + shantenWords(advice.before.shanten) + ' · ' + advice.before.ukeire +

          ' · ' + advice.after.ukeire + ' 张进张。只比较牌效，另看弃牌风险。', cls: advice.better ? 'good' : '' };
    }
    return null;
  }

  var COACH_DEBUG = { picks: 0, shows: 0 };
  var coachLast = { cat: '', id: '', line: null }, coachLastAt = 0, coachLastIdx = {};
  function coachPick(cat, handNo, turn) {
    var list = COACH_LINES[cat] || [];
    if (!list.length) return null;
    var i = avatarHash(cat + '|' + handNo + '|' + turn) % list.length;
    return list[i];
  }
  // 同类不连续重复：命中同上一条时顺延一位（只影响显示层，coachPick 仍是纯函数）
  function coachNextIndex(cat, handNo, turn) {
    var list = COACH_LINES[cat] || [];
    if (!list.length) return -1;
    var i = avatarHash(cat + '|' + handNo + '|' + turn) % list.length;
    if (i === coachLastIdx[cat]) i = (i + 1) % list.length;
    coachLastIdx[cat] = i;
    return i;
  }
  function coachFind(cat, id) {
    var list = COACH_LINES[cat] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function coachEnabled() { return cfg.coach === 'on' && cfg.learningMode !== 'exam'; }
  function resetCoachLines() { coachLast = { cat: '', id: '', line: null }; coachLastAt = 0; coachLastIdx = {}; }
  // 同类短句 5 秒内不换（#coach 是 live region，频繁变化会骚扰读屏）；不加定时器
  function coachLine(cat, preferId) {
    if (!coachEnabled() || !game || !game.hand) return null;
    var now = Date.now();
    if (!preferId && coachLast.cat === cat && coachLast.line && now - coachLastAt < 5000) {
      COACH_DEBUG.shows++;
      return coachLast.line;
    }
    var line = preferId ? coachFind(cat, preferId) : null;
    if (!line) {
      var idx = coachNextIndex(cat, game.handNo, game.hand.turnCount || 0);
      line = idx >= 0 ? COACH_LINES[cat][idx] : null;
    }
    if (!line) return null;
    coachLast = { cat: cat, id: line.id, line: line };
    coachLastAt = now;
    COACH_DEBUG.picks++;
    return line;
  }
  try {
    window.__zmjCoach = { version: 1, lines: COACH_LINES, pick: coachPick, debug: COACH_DEBUG,
      last: function () { return coachLast; } };

  function renderCoach() {
    var H = game.hand, a = game.awaiting, box = $('coach');
    var eyebrow = $('coachEyebrow'), main = $('coachMain'), detail = $('coachDetail');
    box.className = '';
    if (H.over && H.result) {
      eyebrow.textContent = '本局结束'; main.textContent = H.result.title;
      detail.textContent = '查看结算，然后继续下一局';
    } else if (a && a.seat === game.humanSeat()) {
      if (a.type === 'turn' && drawPending2D()) {
        eyebrow.textContent = '轮到你摸牌';
        main.textContent = '先从牌墙摸一张';
        detail.textContent = '点中央「牌墙」或下方「从牌墙摸牌」；摸入张翻开后再看出牌建议。';
        return;
      }
      if (!liveHints()) {
        eyebrow.textContent = cfg.learningMode === 'exam' ? '整局测验' : '先独立判断';
        main.textContent = a.type === 'turn' ? '这手你会怎么打？' : '选择碰、杠、胡或过';
        detail.textContent = hiddenHintText(); return;
      }
      // 轮到你做决定时，推荐必须压过「上一手复盘」：
      // 否则你刚打完牌、别人打出的牌正好能碰/杠/胡，中间却还在显示上一手的复盘。
      if (a.type === 'claim') {
        var cAdv = claimAdvice();
        eyebrow.textContent = '轮到你决定';
        if (cAdv) {
          main.textContent = cAdv.main; detail.textContent = cAdv.detail;
          if (cAdv.cls) box.classList.add(cAdv.cls);
        } else {
          main.textContent = '碰、杠、胡，还是过？';
          detail.textContent = '先看牌形和剩余牌，再做选择';
        }
      } else {
        var tAdv = claimAdvice();
        eyebrow.textContent = '全桌第 ' + H.turnCount + ' 摸 · 你的回合';
        if (tAdv) {
          main.textContent = tAdv.main; detail.textContent = tAdv.detail;
          if (tAdv.cls) box.classList.add(tAdv.cls);
        } else {
          var opts = getDiscardOptions();
          var guide = opts.length ? getTrainingGuide(opts[0].kind, false) : null;
          main.textContent = guide ? '牌效推荐打 ' + ZMJ.tileName(guide.kind) : '观察牌形，选一张弃牌';
          detail.textContent = guide ?
            ('打后' + (guide.shanten === 0 ? '听牌' : guide.shanten + ' 向听') +
              ' · 有效 ' + guide.draws.length + ' 种 / 未见 ' + guide.total + ' 张 · 详见出牌讲解') :
            '每次摸牌后重新比较向听和有效进张';
        }
      }
    } else if (feedback && feedback.handNo === game.handNo && cfg.learningMode !== 'exam') {
      eyebrow.textContent = '上一手复盘';
      main.textContent = feedback.main;
      detail.textContent = feedback.detail;
      // 风险句优先（只读采样值，不改既有结论）；否则答错句替换 main，原结论进 detail
      var fbRisk = (feedback.risk != null && feedback.risk >= 0.15) ? coachLine('risk') : null;
      var fbWrong = (!fbRisk && feedback.grade === 'warn') ? coachLine('wrong') : null;
      if (fbRisk) detail.textContent = feedback.detail + '｜' + fbRisk.text;
      else if (fbWrong) {
        main.textContent = fbWrong.text;
        detail.textContent = '『' + feedback.main + '』' + feedback.detail;
      }
      box.classList.add(feedback.grade);
    } else {
      eyebrow.textContent = '牌局进行中';
      var waitLine = coachLine('wait');

  function btn(label, cls, fn) {
    var b = document.createElement('button');
    b.className = 'act ' + (cls || '');
    b.textContent = label;
    b.onclick = fn;
    return b;
  }
  function act(fn) {
    if(table3D.busy||game.hand.dicePending||game.online&&game.hand.dealRemainingMs>0)return false;
    if (!fn()) return false;
    turnDeadline = 0; pauseStarted = 0;
    if (game.online) return true; // 已在发送时更新等待状态；不能重算旧牌面的讲解。
    render(); timer = setTimeout(tick, 120);
    return true;
  }
  function discardReview(kind, opts, context) {
    if (!opts.length) return null;
    var best = opts[0];
    var picked = opts.filter(function (o) { return o.kind === kind; })[0];
    if (!picked) return null;
    var same = ZMJ.sameEfficiency(picked, best);
    var main = same ? '与牌效推荐一致' :
      (picked.shanten > best.shanten ? '这手增加了 ' + (picked.shanten - best.shanten) + ' 向听' :
        picked.ukeire < best.ukeire ? '比推荐少 ' + (best.ukeire - picked.ukeire) + ' 张进张' : '牌效接近推荐');
    var detail = '你打 ' + ZMJ.tileName(kind) + '；牌效推荐 ' + ZMJ.tileName(best.kind) +
      '（' + best.shanten + ' 向听，进张 ' + best.ukeire + '）';
    var riskProb = null;
    if (cfg.analyze) {
      try {
        var sit = context ? null : getSituation();
        var res = context ? context.risk : sit && sit.res;
        if (res) {
          riskProb = res.dealIn(kind).prob;
          detail += '；该张采样放铳风险约 ' + (riskProb * 100).toFixed(1) + '%';
        }
      } catch (e) {}
    }
    return { handNo: context ? context.handNo : game.handNo, main: main, detail: detail, grade: same ? 'good' : 'warn',
      turn: context ? context.turn : game.hand.turnCount, picked: kind, best: best.kind,
      shantenLoss: picked.shanten - best.shanten,
      outsLoss: picked.shanten === best.shanten ? best.ukeire - picked.ukeire : 0,
      risk: riskProb };
  }
  function onDiscardClick(kind, tileId) {
    if(table3D.busy||game.hand.dicePending||game.online&&game.hand.dealRemainingMs>0)return;
    if(drawPending2D()){nudgeDraw();return;}
    if(document.body.classList.contains('table3d')&&handArrange.drawn&&!handArrange.received){
      if(tileId===handArrange.drawn)acceptDrawnTile();
      return;
    }
    if (!game.awaiting || game.awaiting.type !== 'turn') return;
    if (game.online && (NET.pendingAction || NET.status !== 'on')) return;
    // 触屏：第一次点选、再点同一张才打出，避免误触
    var key = situationKey();
    if ((isTouch || document.body.classList.contains('table3d')) && (!selectedTile || selectedTile.id !== tileId || selectedTile.key !== key)) {
      selectedTile = { kind: kind, id: tileId, key: key };
      // 只更新选中牌及操作提示，不重画整桌、不触发分析。
      document.querySelectorAll('.handRow .tile[role="button"]').forEach(function (tile) {
        var chosen = tile.getAttribute('data-tile-id') === tileId;
        tile.classList.toggle('chosen', chosen); tile.setAttribute('aria-pressed', chosen ? 'true' : 'false');
      });
      renderActions();
      syncTable3D();
      sfx('select');
      showTileAnalysis(kind, tileId, document.querySelector('.handRow [data-tile-id="' + tileId + '"]'), true); return;
    }
    commitDiscard(kind, tileId);
  }
  // 拖到中央牌河松手 = 直接确认出牌；点选路径仍保留二次确认。
  function commitDiscard(kind, tileId) {
    if (!game || !game.hand) return false;
    if(table3D.busy||game.hand.dicePending||game.online&&game.hand.dealRemainingMs>0)return false;
    if(drawPending2D()){nudgeDraw();return false;}
    if(document.body.classList.contains('table3d')&&handArrange.drawn&&!handArrange.received){
      if(tileId===handArrange.drawn)acceptDrawnTile();
      return false;
    }
    if (!game.awaiting || game.awaiting.type !== 'turn') return false;
    if (game.online && (NET.pendingAction || NET.status !== 'on')) return false;
    var key = situationKey();
    hideTileAnalysis();
    if(table3D.api&&table3D.wanted)table3D.api.noteDiscard(tileId);
    if (game.online) {
      var hand = game.hand, seat = game.humanSeat();
      var context = { handNo: game.handNo, turn: hand.turnCount, risk: sitCache.key === key && sitCache.data ? sitCache.data.res : null };
      var cached = decisionCache && decisionCache.key === key ? decisionCache.report.candidates : null;
      NET.actionTileId = tileId;
      var sent = act(function () { return game.humanDiscard(kind); });
      NET.actionTileId = null;
      if (!sent) return false;
      selectedTile = null;
      // 发包优先；复盘只读发送时保存的公开局面，不为点击临时启动风险采样。
      NET.pendingReviews[NET.lastActionId] = discardReview(kind, cached || ZMJ.evaluateDiscards(hand, seat), context);
      return true;
    }
    var opts = getDiscardOptions();
    var review = discardReview(kind, opts);
    selectedTile = null;
    if (act(function () { return game.humanDiscard(kind); })) {
      // 联机发出操作不等于操作被接受；过期或连点被拒绝时不能计入成绩。
      if (game.online) NET.pendingReviews[NET.lastActionId] = review;
      else acceptDiscardReview(review);
      return true;
    }
    return false;
  }
  function acceptDiscardReview(review) {
    if (!review || !game || review.handNo !== game.handNo) return;
    if (handExtra) {
      handExtra.recTotal++;
      if (review.grade === 'good') handExtra.recFollow++;
      handExtra.reviews.push(review);
    }
    feedback = review; if (!game.online) renderCoach();
  }

  function guidePathsHTML(guide, start) {
    return guide.paths.slice(start || 0).map(function (p) {
      return '<div class="guidePath">摸 ' + ZMJ.tileName(p.draw) + '（未见 ' + p.drawCount + ' 张）→ 打 ' +
        ZMJ.tileName(p.discard) + ' → 听 ' + p.waits.map(function (k, i) { return ZMJ.tileName(k) + '×' + p.waitCounts[i]; }).join('、') +
        '，合计未见 ' + p.waitTotal + ' 张。</div>';
    }).join('');
  }
  function renderHint() {
    var el = $('hint');
    if (!liveHints()) { el.textContent = hiddenHintText(); return; }
    var hs = game.humanSeat();
    if (hs < 0) { el.innerHTML = '<span style="color:#9fb3a8">你在等待区，先看看别人怎么打。</span>'; return; }
    var H = game.hand, p = H.players[hs], a = game.awaiting;
    var rows = [];
    if (drawPending2D()) { el.innerHTML = '<b>先从牌墙摸牌</b><br>点中央「牌墙」或下方「从牌墙摸牌」；摸入张翻开后再看出牌建议。'; return; }
    // 胡牌抉择提示
    if (a && a.type === 'claim' && a.options.hu) {
      var outs = game.ukeireFor(hs).total;
      var unknown = ZMJ.visiblePool(H, hs).reduce(function (sum, n) { return sum + n; }, 0);
      rows.push('<b>建议收炮落袋</b>');
      rows.push('现在可以和牌。若放过，下一次自摸的基准命中率为 ' + outs + ' ÷ ' + unknown +
        ' ≈ ' + (ZMJ.drawChance(outs, unknown, 1) * 100).toFixed(1) + '%。');
      rows.push('这是固定听口、未见牌随机分布的模型；对手可能先胡，不能据此推导等待自摸的总收益。');
      rows.push('放过后，直到自己下次摸牌前不能再胡炮。');
      el.innerHTML = rows.join('<br>'); return;
    }
    if (!a || a.type !== 'turn' || a.seat !== hs) {
      var claim = claimAdvice();
      el.textContent = claim ? claim.main + '：' + claim.detail : '摸到牌、轮到你出牌时，这里会按每个弃牌选择重新计算。';
      return;
    }
    var opts = getDiscardOptions();
    var guide = opts.length ? getTrainingGuide(opts[0].kind, true) : null;

    var stateName = shantenWords(guide.shanten);
    var hitName = guide.shanten === 0 ? '和牌张' : '有效进张';

    if (guide.deadWait) rows.push('<div class="guideMath">结构上已经听牌，但和牌张全部可见：未见有效张为 0。需要改良听口。</div>');
    var special = claimAdvice();
    if (special) rows.push('<div class="guideNote">' + netEsc(special.main + '：' + special.detail) + '</div>');
    rows.push('<div class="guideNote">向听是离听牌的牌形距离，0 向听就是已听牌；有效进张是下一摸能降低向听的牌。推荐先比较向听，再比较未见有效张数；放铳风险另列。</div>');
    rows.push('<div class="guideStep">① 打后会等哪些牌？</div>');
    rows.push('<div>共 <b>' + guide.draws.length + '</b> 种' + hitName + '，未见 <b>' + guide.total + '</b> 张：</div>');
    rows.push('<div class="guideTiles">' + (guide.draws.length ? guide.draws.map(function (d) {
      return '<span>' + ZMJ.tileName(d.kind) + ' × ' + d.count + '</span>';
    }).join('') : '<span>当前没有未见有效牌</span>') + '</div>');
    rows.push('<div class="guideMath">下一次自己摸到' + hitName + '的基准概率：' +
      guide.total + ' ÷ ' + guide.unknown + ' 张未见牌 ≈ <b>' +
      (guide.chanceNext * 100).toFixed(1) + '%</b></div>');
    rows.push('<div class="guideStep">② 为什么比其他弃牌好？</div>');
    rows.push('<div class="guideCompare"><b>弃牌</b><b>打后</b><b>未见' + hitName + '</b>');
    opts.slice(0, 3).forEach(function (o) {
      var g = getTrainingGuide(o.kind, true);
      rows.push('<span>' + ZMJ.tileName(o.kind) + (o.kind === guide.kind ? ' ★' : '') +
        '</span><span>' + (g.shanten === 0 ? '听牌' : g.shanten + ' 向听') +
        '</span><span>' + (g.shanten === guide.shanten ? g.total + ' 张' : '不同阶段') +
        (g.averageWait !== null ? '<br><small>进张后平均听 ' + g.averageWait.toFixed(1) + ' 张</small>' : '') + '</span>');
    });
    rows.push('</div>');
    if (opts.length > 1) {
      var second = getTrainingGuide(opts[1].kind, false);
      if (second.shanten > guide.shanten) {
        rows.push('<div class="guideNote">例如打 ' + ZMJ.tileName(second.kind) + ' 会退到 ' +
          second.shanten + ' 向听；不同向听阶段的进张数字不能直接比较。</div>');
      } else if (second.total < guide.total) {
        rows.push('<div class="guideNote">同样是 ' + stateName + '，打 ' + ZMJ.tileName(guide.kind) +
          ' 比打 ' + ZMJ.tileName(second.kind) + ' 多 ' + (guide.total - second.total) +
          ' 张未见' + hitName + '。</div>');

        rows.push('<div class="guideNote">前两种弃牌的向听和进张相同，均属本轮牌效最优；排列先后不代表谁更安全。还可以比较未来听口和采样风险。</div>');

      '普通牌型按四组面子加一对将，小七对单独计算，取较近的路线。</div>' +

      '<div>有效进张是下一摸能降低向听的牌；听牌时则是能直接和牌的牌。每种牌原有四张，减去自己手牌与公开牌，得到“未见张数”。</div>' +

      '<a href="https://github.com/tomohxx/necessary-and-unnecessary-tiles" target="_blank" rel="noopener noreferrer">有效牌的开源计算示例</a>。</div></details>');

      return '<option value="' + o.kind + '">' + ZMJ.tileName(o.kind) + '</option>';

        trial.draws.map(function (d) { return ZMJ.tileName(d.kind) + '×' + d.count; }).join('、') +
        (trial.averageWait !== null ? '。进张后平均听 ' + trial.averageWait.toFixed(1) + ' 张。' : '');
      $('guideTrial').innerHTML += guidePathsHTML(trial, 0);

  }

  function renderSettlementHands(box,result) {

  // ---------- 训练统计看板（放铳率为核心指标：调研显示水平提升几乎全部来自少放铳） ----------
  function sparkline(vals) {
    if (!vals.length) return '';
    var w = 260, h = 46, mx = Math.max(20, Math.max.apply(null, vals.map(Math.abs)));
    var bw = Math.max(2, w / vals.length - 1.5);
    var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:46px" preserveAspectRatio="none">';
    out += '<line x1="0" y1="' + (h / 2) + '" x2="' + w + '" y2="' + (h / 2) + '" stroke="rgba(255,255,255,.18)" stroke-width="1"/>';
    vals.forEach(function (v, i) {
      var bh = Math.abs(v) / mx * (h / 2 - 2);
      var x = i * (w / vals.length);
      var y = v >= 0 ? (h / 2 - bh) : (h / 2);
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + (v >= 0 ? '#4cc47c' : '#ff9a8b') + '"/>';
    });
    return out + '</svg>';
  }

  function netConnect(done) {
    if (NET.ws && (NET.ws.readyState === 0 || NET.ws.readyState === 1)) { if (done) done(); return; }
    var url;
    try { url = netURL(); } catch (e) {
      NET.status = 'error'; NET.err = e.message; netBar(); if ($('netBox')) renderNet(); return;
    }
    NET.status = 'connecting'; NET.err = ''; netBar(); if ($('netBox')) renderNet();
    var ws;
    try { ws = new WebSocket(url); }
    catch (e) { NET.status = 'error'; NET.err = '服务器地址不对：' + url; netBar(); if ($('netBox')) renderNet(); return; }
    NET.ws = ws;
    clearTimeout(NET.connectTimer);NET.authError=false;
    var connectedThisAttempt=false;
    NET.connectTimer=setTimeout(function(){if(NET.ws!==ws||ws.readyState===1)return;NET.status='error';NET.err='暂时连不上联机服务，请稍后重试。';ws.close();netBar();if($('netBox'))renderNet();},12000);
    ws.onopen = function () {
      if (NET.ws !== ws) return;
      connectedThisAttempt=true;clearTimeout(NET.connectTimer);
      NET.status = 'on'; NET.retry = 0; NET.err = ''; NET.everConnected = true;
      NET.roundTrip = null; NET.lastConfirm = null; NET.serverMs = null; NET.probeUnsupported = false; clearPendingAction(); netProbe();
      netBar();
      // 等 welcome 确认身份及服务实例，再恢复房间，避免重启后误建旧房间。
      if (done) done();
    };
    ws.onmessage = function (ev) {
      if (NET.ws !== ws) return;
      var m = null;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      onNetMessage(m);
    };
    ws.onclose = function (event) {
      if (NET.ws !== ws) return;
      NET.ws = null;
      clearTimeout(NET.connectTimer);
      clearPendingAction(); clearTimeout(NET.probeTimer); NET.probe = null; cancelOnlineAnalysis();
      stopRiskWorker();
      NET.pendingReviews = {};
      NET.presence=null;hideTileAnalysis();
      if (NET.status === 'error') { netBar(); if($('netBox'))renderNet();return; }
      NET.status = 'error';
      if (game && game.online && game.hand) render();
      // 从没连上过 = 地址不对或没有服务；连上过又断 = 掉线。两种提示不能混。
      NET.err = NET.authError ? '账号登录已过期，请先重新登录再接回原座位。' : event.code===1008 ? '连接因流量或接收限制断开，请稍后重连。' : connectedThisAttempt
        ? '与服务器断开了，正在自动重连…'
        : '暂时连不上联机服务，稍后可自动重试。';
      netBar();
      if (!NET.authError && NET.retry < 5 && !NET.replaced) {
        NET.retry++;
        clearTimeout(NET.retryTimer);NET.retryTimer=setTimeout(function () { netConnect(); }, 800 * NET.retry);
      } else if (NET.room) {
        netToast('已断开，点「联机」可以手动重连');
      }
      if ($('netBox')) renderNet();
    };
    ws.onerror = function () { if (NET.ws !== ws) return; NET.err = '暂时连不上联机服务'; };
  }

  // ---------- 代理牌局：形状与单机 game 完全一致，界面代码一行都不用改 ----------
  function makeProxyGame() {
    var P = {
      online: true, seats: [], queue: [], hand: null, awaiting: null, lastResult: null,
      logs: [], handNo: 0, dealer: 0, records: [], fastForward: false, mySeat: -1, lastRecord: null
    };
    P.humanSeat = function () { return P.mySeat; };
    P.nameOf = function (seat) { return (P.seats[seat] && P.seats[seat].name) || ('座位' + ((seat | 0) + 1)); };
    P.aiStep = function () { return false; };            // 电脑由服务器驱动
    P.hasPendingResolve = function () { return false; };
    P.resolvePending = function () { return false; };
    P.startHand = function () { netSend({ t: 'start',manualDice:table3D.wanted }); };
    P.nextHand = function () { netSend({ t: 'next' }); };
    P.humanDiscard = function (kind) { return netSend({ t: 'act', act: 'discard', kind: kind }); };
    P.humanClaim = function (act, kind) { return netSend({ t: 'act', act: act, kind: kind }); };
    P.humanGang = function (kind, type) {
      return netSend({ t: 'act', act: type === 'an' ? 'angang' : 'bugang', kind: kind });
    };
    P.humanZimo = function () { return netSend({ t: 'act', act: 'zimo' }); };
    P.setAiStyle = function () {};
    P.drawsLeft = function () { return P.hand ? Math.floor(P.hand.wall.length / 4) : 0; };
    P.turnOptionsFor = function (seat) {
      var a = P.awaiting;
      if (a && a.type === 'turn' && (seat == null || seat === a.seat)) return a.options;
      return { canZimo: false, anGang: [], buGang: [], tile: null };
    };
    P.evaluateDiscards = function (seat) {
      var s = (seat == null ? P.mySeat : seat);
      if (!P.hand || s < 0) return [];
      try { return ZMJ.evaluateDiscards(P.hand, s); } catch (e) { return []; }
    };
    P.ukeireFor = function (seat) {
      var s = (seat == null ? P.mySeat : seat);
      if (!P.hand || s < 0) return { total: 0, kinds: [] };
      var p = P.hand.players[s];
      try { return ZMJ.ukeire(p.concealed, p.melds.length, ZMJ.visiblePool(P.hand, s)); }
      catch (e) { return { total: 0, kinds: [] }; }
    };
    P.sevenPairsShanten = function () {
      if (!P.hand || P.mySeat < 0) return 99;
      try { return ZMJ.shantenSevenPairs(P.hand.players[P.mySeat].concealed); } catch (e) { return 99; }
    };
    P.exportRecords = function () {
      return { game: '转转麻将（联机）', version: 3, rulesVersion: ZMJ.rulesVersion, analysisVersion: ZMJ.analysisVersion, exportedAt: new Date().toISOString(),
               rules: ZMJ.RULES || null, hands: P.records };
    };
    P.exportText = function () {
      var L = ['转转麻将 · 联机牌谱  ' + new Date().toLocaleString(), '房间 ' + NET.room, ''];
      for (var i = 0; i < P.records.length; i++) {
        var r = P.records[i], res = r.result || {};
        L.push('第 ' + r.no + ' 局：' + (res.title || '') +
          '  收支 ' + (res.deltas || []).join(' / '));
      }
      if (P.records.length === 0) L.push('（本次联机还没有打完一局）');
      return L.join('\n');
    };
    P.applyView = function (v) {
      NET.state = v;
      if(v.archiveError&&!NET.archiveError)netToast('联机存档暂时写入失败，服务器正在重试，请保留本局牌谱');
      NET.archiveError=!!v.archiveError;accountSyncLabel();
      P.mySeat = (v.you && typeof v.you.seat === 'number') ? v.you.seat : -1;
      var rs = (v.room && v.room.seats) ? v.room.seats : [];
      P.seats = [];
      for (var i = 0; i < 4; i++) {
        var s = rs[i];
        // 还没开局时服务器不发座位，这里必须给占位对象：界面会直接读 seats[i].isHuman
        P.seats.push(s ? { name: s.name, score: s.score, isHuman: !!s.isHuman, online: !!s.online,
                           zimoCount: s.zimoCount, paoCount: s.paoCount,
                           handsWon: s.handsWon, handsPlayed: s.handsPlayed }
                       : { name: '空位', score: 0, isHuman: false, online: true,
                           zimoCount: 0, paoCount: 0, handsWon: 0, handsPlayed: 0 });
      }
      P.queue = [];
      var q = (v.room && v.room.queue) ? v.room.queue : [];
      for (var j = 0; j < q.length; j++) P.queue.push({ name: q[j].name, isHuman: !!q[j].isHuman });
      var previousHandNo = P.handNo;
      P.handNo = v.room ? v.room.handNo : 0;
      if (P.handNo !== previousHandNo) {
        resetHandExtra(); feedback = null;
        if ($('btnNext')) $('btnNext').textContent = '返回当前牌局';
      }
      if (!v.hand) { P.hand = null; P.awaiting = null; P.lastResult = null; return; }
      var h = v.hand;
      P.dealer = h.dealer;
      P.awaiting = h.awaiting
        ? { type: h.awaiting.type, seat: P.mySeat, options: h.awaiting.options, tile: h.awaiting.tile }
        : null;
      var players = [];
      for (var s2 = 0; s2 < 4; s2++) {
        var pub = h.players[s2] || {};
        var mineHere = h.mine && h.mine.seat === s2;
        var cons = [];
        for (var k = 0; k < ZMJ.KINDS; k++) cons.push(mineHere ? (h.mine.concealed[k] || 0) : 0);
        players.push({
          concealed: cons,
          concealedCount: pub.concealedCount,                 // 界面画对手的牌背时用这个
          melds: (pub.melds || []).slice(),
          discards: (pub.discards || []).slice(),
          passedWin: !!pub.passedWin

      }
      P.hand = {
        players: players,
        opening:h.opening||null,wallDraws:h.wallDraws||null,openingAgeMs:h.openingAgeMs,gangDraw:!!h.gangDraw,
        dealtKinds:h.mine&&Array.isArray(h.mine.dealtKinds)?h.mine.dealtKinds.slice():[],
        dicePending:!!h.dicePending,dealRemainingMs:h.dealRemainingMs||0,
        wall: { length: h.wallLeft },                          // 牌墙只给张数，顺序不出服务器
        turn: h.turn, lastDraw: h.lastDraw, lastDiscard: h.lastDiscard,
        turnCount: h.turnCount, over: !!h.over,
        river: Array.isArray(h.river)?h.river:null,
        result: v.result || null,
        revealed: h.over && Array.isArray(h.revealed)?h.revealed:null,
        birds: (v.result && v.result.birds) ? v.result.birds : []
      };
      P.lastResult = v.result || null;
      P.logs = (v.logs || []).slice();

      }
    };

  }

  function onNetMessage(m) {
    if (!m || !m.t) return;
    if (m.t==='welcome') {
      if(m.instance&&NET.instance&&m.instance!==NET.instance&&NET.room){NET.room='';NET.token='';NET.state=null;proxyGame=null;if(game&&game.online){game=null;showHome();}try{sessionStorage.removeItem('zmj_seat_v1');}catch(e){}netToast('联机服务已恢复，原对局已中断，请重新进入房间。');}
      NET.instance=m.instance||NET.instance;NET.identity=m.identity||NET.identity;NET.name=identityName();NET.presence=readPresence(m.presence);NET.lobby=m.rooms||[];NET.replaced=false;
      if(NET.room)netJoin(NET.room,NET.name,NET.token);else netSend({t:'rooms'});netBar();if($('netBox'))renderNet();return;
    }
    if(m.t==='presence'){var people=readPresence(m);if(!people)return;var changed=JSON.stringify(NET.lobby)!==JSON.stringify(m.rooms||[]);NET.presence=people;NET.lobby=m.rooms||[];netBar();if(changed&&$('netBox'))renderNet();else updateOnlineLabels();return;}
    if (m.t === 'rooms') { NET.lobby = m.rooms || null; if ($('netBox')) renderNet(); return; }
    if (m.t === 'joined') {
      NET.room = m.room; NET.token = m.token; NET.pid = m.pid;
      if (m.you) NET.name = m.you;
      netSaveCfg();
      try { sessionStorage.setItem('zmj_seat_v1', JSON.stringify({ room: NET.room, token: NET.token, server: NET.server })); } catch (e) {}
      netToast('进入房间 ' + m.room);
      netBar();
      if ($('netBox')) renderNet();
      return;
    }
    if (m.t === 'replaced') {
      NET.replaced=true;clearTimeout(NET.retryTimer);
      NET.room = ''; NET.token = ''; NET.status = 'error'; NET.err = m.msg;
      NET.state = null; proxyGame = null;
      if (game && game.online) { game = null; clearTimeout(timer); }
      try { sessionStorage.removeItem('zmj_seat_v1'); } catch (e) {}
      netBar(); closeModal(); showHome(); netToast(m.msg); return;
    }
    if (m.t === 'left') { NET.room = ''; NET.state = null; netBar(); if ($('netBox')) renderNet(); return; }
    if (m.t === 'err') {
      if(m.code==='auth'){NET.authError=true;if(NET.ws)NET.ws.close(1008,'login required');}
      if (m.requestId) delete NET.pendingReviews[m.requestId];
      if (NET.pendingAction && m.requestId === NET.pendingAction.requestId) { clearPendingAction(); if (game && game.online) render(); }
      netToast(m.msg); NET.err = m.msg; if ($('netBox')) renderNet(); return;
    }
    if (m.t === 'ack') {
      if (NET.pendingAction && NET.pendingAction.requestId === m.requestId) {
        NET.lastConfirm = Math.round(performance.now() - NET.pendingAction.at);
        NET.serverMs = Number.isFinite(m.serverMs) ? m.serverMs : null;
        NET.pendingAction.acknowledged = true; netDiagnostics();
      }
      var accepted = NET.pendingReviews[m.requestId]; delete NET.pendingReviews[m.requestId];
      if (accepted) acceptDiscardReview(accepted);
      return;
    }
    if (m.t === 'pong') {
      if (NET.probe && m.probe === NET.probe.id) { NET.roundTrip = Math.round(performance.now() - NET.probe.at); NET.probe = null; netDiagnostics(); }
      else if (NET.probe && m.probe == null) { NET.probeUnsupported = true; NET.probe = null; netDiagnostics(); }
      return;
    }
    if (m.t === 'chat') { netToast(m.from + '：' + m.text); return; }
    if (m.t === 'state') {
      if (NET.pendingAction && NET.pendingAction.acknowledged && m.rev > NET.pendingAction.rev) clearPendingAction();
      var P = netUseProxy();
      P.applyView(m);
      netBar();
      tick();
      if ($('netBox')) renderNet();
      return;
    }
  }

      $('netEnter').onclick = function () { joinIt($('netRoomIn').value.trim()); };
      $('netClose2').onclick = function () { closeModal(); };
      if(roomFocused){$('netRoomIn').focus();$('netRoomIn').setSelectionRange(roomCaret,roomCaret);}
      var btns = box.querySelectorAll('button[data-room]');
      for (var b = 0; b < btns.length; b++) {
        btns[b].onclick = function () { joinIt(this.getAttribute('data-room')); };
      }
      return;
    }
    // 已在房间里
    var st = NET.state;
    h += '<div style="font-size:13px;color:#cfd8d3">房间 <b style="color:#f2c14e">' + netEsc(NET.room) + '</b>' +
      (st && st.room && st.room.phase === 'playing' ? ' · 第 ' + st.room.handNo + ' 局' : ' · 还没开局') + '</div>';
    if (st && st.room) {
      h += '<div style="margin-top:8px;font-size:13px;line-height:1.9">';
      for (var s = 0; s < st.room.seats.length; s++) {
        var seat = st.room.seats[s];
        if (!seat) continue;
        var me = st.you && st.you.seat === s;
        h += '<div>' + (me ? '<b style="color:#f2c14e">▶ </b>' : '') + netEsc(seat.name) +
          (seat.isHuman ? '' : '（电脑）') + (seat.isHuman && !seat.online ? ' <span style="color:#e2685a">掉线托管中</span>' : '') +
          ' <span style="color:#9fb3a8">' + seat.score + ' 元</span></div>';
      }
      if (st.room.queue.length) {
        h += '<div style="font-size:12px;color:#9fb3a8;margin-top:6px">等待区：' +
          st.room.queue.map(function (q) { return netEsc(q.name) + (q.isHuman ? '' : '(电脑)'); }).join('、') + '</div>';
      }
      if (st.you && st.you.queued) {
        // 说实话：桌上全是真人时，谁都不会因为赢牌下桌，等也等不到
        var botSeats = st.room.seats.filter(function (s) { return s && !s.isHuman; }).length;
        h += '<div style="font-size:12px;color:#ffcf7a;margin-top:6px">' + (botSeats
          ? '你在等待区：桌上只要有电脑胡牌就会换人，你排在最前面，优先上桌'
          : '你在等待区：桌上 4 位都是真人，真人赢牌不下桌，要等有人离开房间才轮得到你') + '</div>';
      }
    }
    h += '</div>';
    h += '<div class="center" style="margin-top:12px">';
    if (!st || !st.room || st.room.phase !== 'playing') h += '<button class="act" id="netStart">开始对局</button> ';
    else if (st.hand && st.hand.over) h += '<button class="act" id="netNext">下一局</button> ';
    h += '<button class="act pass" id="netCopyLink">复制邀请链接</button> ';
    h += '<button class="act pass" id="netLeave">离开房间</button> ';
    h += '<button class="act pass" id="netClose3">关闭</button></div>';
    h += '<div style="font-size:12px;color:#9fb3a8;margin-top:8px;line-height:1.7">' +
      '规则和单机完全一样：服务器负责发牌和判定，所有人看到的都是同一副牌。' +
      '谁掉线了电脑先替他打，重连后接着自己打。</div>';
    box.innerHTML = h;
    if ($('netStart')) $('netStart').onclick = function () { netSend({ t: 'start',manualDice:table3D.wanted }); };
    if ($('netNext')) $('netNext').onclick = function () { netSend({ t: 'next' }); };
    $('netCopyLink').onclick = function () {
      var invite = new URL(location.protocol === 'file:' ? netURL().replace(/^ws/, 'http').replace(/\/ws$/, '/') : location.href);
      invite.search = ''; invite.hash = ''; invite.searchParams.set('room', NET.room);
      if (NET.server) invite.searchParams.set('server', netURL());
      var url = invite.href;
      var done = function (ok) { netToast(ok ? '邀请链接已复制，发给朋友即可' : '复制被浏览器拒绝，链接是：' + url); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { done(true); }, function () { done(false); });
        else done(false);
      } catch (e) { done(false); }
    };
    $('netLeave').onclick = function () { netLeave(); closeModal(); };
    $('netClose3').onclick = function () { closeModal(); };
  }

  function netOpenBox() {
    $('modalBox').innerHTML = '<h2>联机大厅</h2><div id="netBox"></div>';
    $('netBox').addEventListener('click',function(e){if(e.target.closest('#netAccount'))showAccount();});
  }

  // 与离线缓存同步，保留远端新增的首页版本标识。
  var BUILD = 'v56';
  // ---------- 主界面：先选单机还是联机 ----------
  function showHome() {
    if (!STATS) loadStats();
    var el = $('home');
    if (!el) { el = document.createElement('div'); el.id = 'home'; document.body.appendChild(el); }
    var sum = null;
    try { sum = ZMJ.statsSummary(STATS || ZMJ.newStats()); } catch (e) { sum = null; }
    var stat = sum
      ? ('已练 ' + sum.hands + ' 局 · 和了率 ' + pct(sum.winRate) + ' · 放铳率 ' + pct(sum.paoRate) +
         ' · 每局 ' + (sum.perHand >= 0 ? '+' : '') + sum.perHand.toFixed(1) + ' 元')
      : '还没有练习记录：打几局之后这里会显示你的和了率、放铳率和收支';
    el.innerHTML =
      '<div class="homeWrap">' +
        '<div class="homeHeader"><div class="homeBrand"><span class="brandMark" aria-hidden="true">转</span>转转麻将<small>练牌室</small></div><div class="homeAccountControls"><span class="homeStamp">静下心，练一手好牌</span><button class="mini" id="home3D">3D 试打一局</button><button class="mini" id="homeAccount">登录 / 我的账号</button></div></div>' +
        '<div class="homeHero"><p class="homeEyebrow">转转麻将 · 私人练习桌</p><h1 class="homeTitle">午后牌室</h1></div>' +
        '<div class="homeCards">' +
          '<button class="homeCard homePractice" id="homePractice">' +
            '<span class="homeCardTop"><span class="homeIndex">01 / 每日一练</span><span class="homeCardIcon" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="6" y="3" width="16" height="22" rx="3"/><path d="M11 9h6m-6 5h6m-6 5h3"/></svg></span></span>' +
            '<span class="homeTag">牌效训练</span><span class="homeDesc">先自己选一张，再看向听、进张和做牌路线。错过的好牌，留到下次练明白。</span>' +
            '<span class="homeGo">从一道题开始</span></button>' +
          '<button class="homeCard" id="homeSolo">' +
            '<span class="homeCardTop"><span class="homeIndex">02 / 从容上桌</span><span class="homeCardIcon" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="4" y="4" width="20" height="20" rx="5"/><path d="M10 10h8v8h-8zm4-6v3m0 14v3M4 14h3m14 0h3"/></svg></span></span>' +
            '<span class="homeTag">单机练习</span>' +
            '<span class="homeDesc">和三位电脑练一局。边打边看讲解，或先独立判断，结束后回看每次选择。</span>' +
            '<span class="homeGo">开始练习</span>' +
          '</button>' +
          '<button class="homeCard" id="homeOnline">' +
            '<span class="homeCardTop"><span class="homeIndex">03 / 好友同桌</span><span class="homeCardIcon" aria-hidden="true"><svg viewBox="0 0 28 28"><circle cx="10" cy="9" r="4"/><path d="M3 24v-3a7 7 0 0 1 14 0v3m1-19a4 4 0 0 1 0 8m3 3a6 6 0 0 1 4 6v2"/></svg></span></span>' +
            '<span class="homeTag">联机打牌</span>' +
            '<span class="homeDesc">自动连接大厅，邀朋友同桌。账号显示注册名，未登录也可作为访客加入。</span>' +
            '<span class="homeOnlineStatus" id="homeOnlineCount">进入大厅自动连接</span>'+
            '<span class="homeGo">进入房间</span>' +
          '</button>' +
        '</div>' +
        '<div class="homeBottom"><div><div class="homeStatLabel">我的练习足迹</div><div class="homeStat">' + stat + '</div></div>' +
        '<div class="homeRule">108 张 · 万 / 条 / 筒 · 无字牌<br>不能吃，可碰可杠 · 小七对与平胡同价<br>收炮 5+鸟钱，自摸每家 10+鸟钱<br><span id="buildVersion">版本 ' + BUILD + '</span></div></div>' +
      '</div>';
    if (cfg.avatar === 'on') {
      var hv = seatAvatarEl(identityName(), true, 36);
      if (hv) {
        hv.className = 'homeStampAvatar';
        hv.id = 'homeAvatar';
        var hc = el.querySelector('.homeAccountControls');
        if (hc) hc.insertBefore(hv, hc.firstChild);
      }
    }
    el.classList.remove('hidden');
    syncLayers();
    $('homePractice').onclick = function () { hideHome(); startPractice(); };
    $('home3D').onclick=function(){setTable3D(true);$('homeSolo').click();};
    if (game && !game.online && game.hand && !game.hand.over) $('homeSolo').querySelector('.homeGo').textContent = '继续本局';
    clearTimeout(timer);                      // 菜单期间不推进牌局
    $('homeAccount').onclick = showAccount; accountLabels();
    updateOnlineLabels();
    refreshLobbyCount();
    $('homeSolo').onclick = function () {
      hideHome();
      if (game && game.online) netLeave(true);  // 从联机切回单机
      if (game && !game.online && game.hand && !game.hand.over) { render(); timer = setTimeout(tick, 200); return; }
      newGame();
    };
    $('homeOnline').onclick = function () { hideHome(); showNet(); };
  }
  function hideHome() { var el = $('home'); if (el) el.classList.add('hidden'); syncLayers(); }

  $('btnExport').onclick = showExport;
  $('riverSource').onchange=function(){cfg.discardSource=this.checked;saveConfig();renderRiver();syncTable3D();};
  $('btnAccount').onclick = showAccount;
  $('btnStats').onclick = showStats;
  $('btnPractice').onclick = startPractice;
  $('btnDojo').onclick = function () { dojoNew(); };
  $('btnReplay').onclick = showReplayList;

  $('btnLandscape').onclick = requestLandscape;
  $('btnRotateIgnore').onclick = function () {
    rotateDismissed = true;
    try { localStorage.setItem('zmj_noRotate', '1'); } catch (e) {}
    updateRotate();
  };
  $('btnPanel').onclick = function () { sheetOpen(!$('side').classList.contains('open')); };
  $('miniHint').onclick = function () { sheetOpen(!$('side').classList.contains('open')); };
  $('scrim').onclick = function () { sheetOpen(false); };
  if (window.addEventListener) window.addEventListener('resize', function () { updateRotate(); if (game) render(); });
  if (window.addEventListener) window.addEventListener('orientationchange', function () { updateRotate(); if (game) render(); });

  $('btnRules').onclick = showRules;
  $('btnSettings').onclick = showSettings;
  (function(){
    var wi=$('wallInfo'),drag=null,ghost=null;
    function rowEl(){return document.querySelector('#seat0 .handRow');}
    function overRow(x,y){var row=rowEl();if(!row)return false;var r=row.getBoundingClientRect();return x>=r.left-10&&x<=r.right+10&&y>=r.top-18&&y<=r.bottom+18;}
    function cleanup(){if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);ghost=null;wi.classList.remove('dragging');var row=rowEl();if(row)row.classList.remove('draw-target');}
    wi.addEventListener('pointerdown',function(e){
      if(!drawPending2D()||e.button!==0)return;
      drag={x:e.clientX,y:e.clientY,moved:false};
      try{wi.setPointerCapture(e.pointerId);}catch(_e){}
    });
    wi.addEventListener('pointermove',function(e){
      if(!drag)return;
      if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
        drag.moved=true;
        var r=wi.getBoundingClientRect();ghost=backEl('small','draw-ghost');
        ghost.style.left=(r.left+r.width/2-12)+'px';ghost.style.top=(r.top+r.height/2-16)+'px';
        ghost.style.width='24px';ghost.style.height='32px';document.body.appendChild(ghost);wi.classList.add('dragging');
      }
      if(!drag.moved)return;
      e.preventDefault();
      var lift=isTouch?30:8;
      ghost.style.transform='translate('+(e.clientX-drag.x)+'px,'+(e.clientY-drag.y-lift)+'px) scale(1.15) rotate(-4deg)';
      var row=rowEl();if(row)row.classList.toggle('draw-target',overRow(e.clientX,e.clientY));
    });
    wi.addEventListener('pointerup',function(e){
      if(!drag)return;
      var moved=drag.moved,over=overRow(e.clientX,e.clientY);drag=null;cleanup();
      if(moved){wi.dataset.suppressClick='1';if(over)acceptDrawnTile();}
    });
    wi.addEventListener('pointercancel',function(){drag=null;cleanup();});
    wi.addEventListener('click',function(){if(wi.dataset.suppressClick==='1'){wi.dataset.suppressClick='';return;}if(drawPending2D())acceptDrawnTile();});
    wi.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&drawPending2D()){e.preventDefault();acceptDrawnTile();}});
  })();
  $('btnTileArt').onclick = showTileArt;
  $('moreTools').addEventListener('click', function (e) { if (e.target.closest('button')) this.open = false; });
  document.addEventListener('click', function (e) { if (!$('moreTools').contains(e.target)) $('moreTools').open = false; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('moreTools').open) { $('moreTools').open = false; $('moreTools').querySelector('summary').focus(); } });
  (function initNetButton() {
    var tools = document.querySelector('.tools');
    if (tools) {
      var b = document.createElement('button');
      b.id = 'btnNet'; b.className = 'mini'; b.textContent = '联机';
      b.onclick = showNet;
      tools.insertBefore(b, tools.firstChild);
      var hb = document.createElement('button');
      hb.id = 'btnHome'; hb.className = 'mini'; hb.textContent = '主界面';
      hb.onclick = function () {
        if (game && game.online && !window.confirm('正在联机，回主界面会离开房间。确定吗？')) return;
        if (game && game.online) { netLeave(); closeModal(); return; }
        showHome();
      };
      tools.insertBefore(hb, b.nextSibling);
    }
    try {
      var inviteParams = new URLSearchParams(location.search);
      var q = inviteParams.get('room');
      if (q && inviteParams.get('server')) {
        NET.explicitServer=true;
        var inviteServer = inviteParams.get('server');
        if (NET.server !== inviteServer || NET.room && NET.room !== q) { NET.room = ''; NET.token = ''; }
        NET.server = inviteServer;
      }
      if (q && NET.room && NET.room !== q) { NET.room = ''; NET.token = ''; }
      // 朋友发来的邀请链接：跳过主界面，直接进联机面板
      if (q||inviteParams.get('online')==='1') { NET.wantRoom = q||''; setTimeout(function () { hideHome(); showNet(); }, 400); }
    } catch (e) {}
  })();
  $('btnNew').onclick = function () { cfg.seed = (Math.random() * 0xffffffff) >>> 0; newGame(); };

  // 启动提示：JS 跑起来就把它收掉；跑不起来它会留在页面正中告诉用户原因
  if ($('boot')) $('boot').classList.add('hidden');
  updateRotate();
  showHome();          // 先出主界面，由用户选单机还是联机
  accountReady = refreshAccount();
  accountReady.then(refreshLobbyCount);
  try{var threeParams=new URLSearchParams(location.search);if(threeParams.get('view')==='3d'&&threeParams.get('play')==='1'&&!threeParams.get('room')&&threeParams.get('online')!=='1')setTimeout(function(){if($('home3D'))$('home3D').click();},250);}catch(e){}
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
