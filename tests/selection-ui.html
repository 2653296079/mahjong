<!doctype html><meta charset="utf-8"><title>逐张选牌验收</title>
<pre id="log"></pre><iframe id="game" style="width:390px;height:844px;border:0"></iframe>
<script>
var out={ok:false,steps:[],errors:[]};
function check(ok,msg){if(!ok)throw new Error(msg);out.steps.push(msg);}
(async function(){try{
  localStorage.setItem('zmj_cfg_v2',JSON.stringify({seed:20261016,sound:false,analyze:false,turnTime:0}));
  localStorage.setItem('zmj_noRotate','1');
  var f=document.getElementById('game');await new Promise(function(r){f.onload=r;f.src='/index.html?view=2d';});
  var w=f.contentWindow,d=w.document;d.getElementById('homeSolo').click();var g=w.__zmjGame;
  check('ontouchstart' in w || w.navigator.maxTouchPoints>0,'测试浏览器启用了真实触屏确认路径');
  var H=w.ZMJ.practiceHand('pairs-1');g.hand.players=H.players;g.hand.lastDraw=0;
  g.awaiting={type:'turn',seat:0,options:{canZimo:false,anGang:[],buGang:[]}};
  w.dispatchEvent(new w.Event('resize'));
  var drawBtn=d.getElementById('wallDrawTile');
  check(!!drawBtn,'二维轮到自己时先出现摸牌牌背');
  check(d.querySelectorAll('.handRow [data-tile-id]').length===13,'摸牌前手牌仍是 13 张');
  drawBtn.click();
  check(d.querySelectorAll('.handRow [data-tile-id]').length===14,'摸牌后翻开第 14 张');
  check(!d.getElementById('wallDrawTile'),'摸牌后金边提示收起');
  var before=JSON.stringify(g.hand),tiles=Array.from(d.querySelectorAll('.handRow [aria-label="打出一万"]'));
  check(tiles.length>=2,'同种牌有多个可独立选择的位置');
  var ids=tiles.map(function(t){return t.dataset.tileId;});check(new Set(ids).size===ids.length,'相同牌的位置标识互不相同');
  tiles[0].click();
  check(d.querySelectorAll('.handRow .chosen').length===1&&tiles[0].classList.contains('chosen'),'第一下只高亮实际点中的一张');
  check(JSON.stringify(g.hand)===before,'第一次选择不改变手牌');
  tiles[1].click();
  check(d.querySelectorAll('.handRow .chosen').length===1&&tiles[1].classList.contains('chosen'),'点击另一张同种牌时转移选择，不误当作确认出牌');
  check(JSON.stringify(g.hand)===before,'切换同种牌不会打出任何牌');
  w.dispatchEvent(new w.Event('resize'));
  var chosen=d.querySelector('.handRow .chosen');check(chosen&&chosen.dataset.tileId===ids[1],'重画后仍只保留选中的具体位置');
  check(d.querySelectorAll('.handRow .drawn').length===1,'摸入牌的标记也只属于实际那一张');
  var sent=false,old=g.humanDiscard;g.humanDiscard=function(k){sent=k===0;return old.call(g,k);};
  chosen.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
  check(sent,'再次确认同一张牌可正常打出，键盘确认也生效');
  check(d.querySelectorAll('.handRow .chosen').length===0,'出牌后清除选择状态');
  // v41：把手牌拖到中央牌河，松手即出牌（保留点选二次确认）
  var H2=w.ZMJ.practiceHand('pairs-1');
  g.hand.players=H2.players;g.hand.lastDraw=0;
  g.awaiting={type:'turn',seat:0,options:{canZimo:false,anGang:[],buGang:[]}};
  w.dispatchEvent(new w.Event('resize'));
  var drawBtn2=d.getElementById('wallDrawTile');
  if(drawBtn2){
    var wall=drawBtn2,row2=d.querySelector('#seat0 .handRow');
    var wr=wall.getBoundingClientRect(),rr=row2.getBoundingClientRect();
    function pe2(type,x,y){return new w.PointerEvent(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,button:0,pointerId:8,pointerType:'touch'});}
    wall.dispatchEvent(pe2('pointerdown',wr.left+wr.width/2,wr.top+wr.height/2));
    wall.dispatchEvent(pe2('pointermove',rr.left+rr.width/2,rr.top-4));
    check(!!d.querySelector('.draw-ghost'),'把牌墙拖向手牌时出现牌背跟随');
    wall.dispatchEvent(pe2('pointerup',rr.left+rr.width/2,rr.top-4));
    check(!d.getElementById('wallDrawTile'),'把牌墙拖到手牌完成摸牌');
  }
  var row=d.querySelector('#seat0 .handRow');
  var dragTile=row&&row.querySelector('[data-tile-id]');
  check(dragTile,'可打状态下拿到一张可拖拽手牌');
  var beforeDiscards=g.hand.players[0].discards.length;
  var centerEl=d.getElementById('center'),cr=centerEl.getBoundingClientRect(),tr=dragTile.getBoundingClientRect();
  function pe(type,x,y){return new w.PointerEvent(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,button:0,pointerId:7,pointerType:'touch'});}
  dragTile.dispatchEvent(pe('pointerdown',tr.left+tr.width/2,tr.top+tr.height/2));
  row.dispatchEvent(pe('pointermove',cr.left+cr.width/2,cr.top+cr.height/2));
  check(centerEl.classList.contains('drop-ready'),'拖到中央时牌河亮起落点');
  row.dispatchEvent(pe('pointerup',cr.left+cr.width/2,cr.top+cr.height/2));
  check(g.hand.players[0].discards.length===beforeDiscards+1,'松手后这张牌真正进入牌河');
  check(!!d.querySelector('.riverEntry.impact')||d.getElementById('table').classList.contains('discard-impact'),'出牌落桌有命中反馈');
  check(!centerEl.classList.contains('drop-ready'),'出牌后清除牌河落点高亮');
  g.hand.players[0].melds=[{type:'peng',kind:3,from:1}];
  w.dispatchEvent(new w.Event('resize'));
  check(d.querySelectorAll('.meld.fresh').length===1,'碰牌副露有聚拢反馈');
  check(!!d.querySelector('.meld-fly'),'被碰的牌从牌河飞向副露');
  out.ok=true;
}catch(e){out.errors.push(e.message);}
document.getElementById('log').textContent=JSON.stringify(out,null,2);fetch('/__result?d='+encodeURIComponent(JSON.stringify(out)));})();
</script>
